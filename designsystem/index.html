    else if (r.name === 'glossary') renderGlossary(view, r.id);
    else if (r.name === 'settings') renderSettings(view);
    else renderNotFound(view);
    document.querySelectorAll('.topnav a').forEach((a) => {
      if (a.dataset.nav === navKey) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
  }
  function updateChrome() {
    $('#packName').textContent = state.pack ? `${state.pack.title} · v${state.pack.version}` : 'No pack loaded';
    const notice = $('#notice');
    if (!Store.persistent) {
      notice.textContent = 'This browser is not letting the page save anything, so progress lasts only until you close the tab.';
      notice.hidden = false;
    } else notice.hidden = true;
  }

  /* ==== [APP:EDITOR] ==== */
  /* ---- [APP:EDITOR:MODEL] ---- */
  const emptyDiagram = () => ({ v: 1, nodes: [], edges: [], groups: [], seq: 1 });

  function initialDiagram(ch) {
    return ch.start ? C.expandDiagram(ch.start, CAT, { roles: ch.roles }) : emptyDiagram();
  }

  // Drafts and imports are untrusted: keep only well-formed parts the engine knows.
  function sanitizeDiagram(d, ch) {
    if (!d || typeof d !== 'object') return null;
    const num = (v, dflt) => (typeof v === 'number' && Number.isFinite(v) ? v : dflt);
    const out = emptyDiagram();
    const ids = new Set();
    for (const n of Array.isArray(d.nodes) ? d.nodes : []) {
      if (!n || typeof n.id !== 'string' || ids.has(n.id) || !CAT.byType[n.type]) continue;
      ids.add(n.id);
      const props = C.defaultProps(n.type, ch.roles);
      if (n.props && typeof n.props === 'object') {
        for (const k of Object.keys(props)) if (k in n.props) props[k] = n.props[k];
      }
      out.nodes.push({ id: n.id, type: n.type, x: num(n.x, 0), y: num(n.y, 0), label: typeof n.label === 'string' ? n.label : CAT.byType[n.type].label, props });
    }
    const pairs = new Set();
    for (const e of Array.isArray(d.edges) ? d.edges : []) {
      if (!e || typeof e.id !== 'string' || ids.has(e.id) || !ids.has(e.from) || !ids.has(e.to) || e.from === e.to) continue;
      if (pairs.has(e.from + '>' + e.to)) continue;
      pairs.add(e.from + '>' + e.to);
      ids.add(e.id);
      const props = C.defaultEdgeProps();
      if (e.props && typeof e.props === 'object') for (const k of Object.keys(props)) if (k in e.props) props[k] = e.props[k];
      const kind = CAT.edgeKinds.some((k) => k.kind === e.kind) ? e.kind : 'sync';
      out.edges.push({ id: e.id, from: e.from, to: e.to, kind, props });
    }
    for (const g of Array.isArray(d.groups) ? d.groups : []) {
      if (!g || typeof g.id !== 'string' || ids.has(g.id) || !CAT.groupByType[g.type]) continue;
      ids.add(g.id);
      out.groups.push({ id: g.id, type: g.type, x: num(g.x, 0), y: num(g.y, 0), w: Math.max(96, num(g.w, 400)), h: Math.max(80, num(g.h, 240)), label: typeof g.label === 'string' ? g.label : CAT.groupByType[g.type].label });
    }
    out.seq = Math.max(1, num(d.seq, 1));
    return out;
  }

  const draftKey = (cid) => `draft.${state.pack.id}.${cid}`;

  function openWorkspace(ch) {
    const draft = Store.get(draftKey(ch.id));
    const fromDraft = draft && sanitizeDiagram(draft.diagram, ch);
    const auto = window.innerWidth < 600 ? 'list' : 'canvas';
    state.ws = {
      cid: ch.id, ch,
      diagram: fromDraft || initialDiagram(ch),
      locked: new Set(ch.locked || []),
      sel: null, undo: [], redo: [],
      view: { x: 0, y: 0, k: 1 },
      results: null, score: null,
      connectFrom: null,
      mode: state.settings.editorMode === 'auto' ? auto : state.settings.editorMode,
      drawer: null, palCat: 'all', palQuery: '',
      saveTimer: 0,
    };
  }

  function leaveWorkspace() {
    if (!state.ws) return;
    flushSave();
    cancelGesture();
    state.ws = null;
    W = null;
  }

  function scheduleSave() {
    const ws = state.ws;
    clearTimeout(ws.saveTimer);
    ws.saveTimer = setTimeout(flushSave, 500);
  }
  function flushSave() {
    const ws = state.ws;
    if (!ws || !state.pack) return;
    clearTimeout(ws.saveTimer);
    ws.saveTimer = 0;
    Store.set(draftKey(ws.cid), { diagram: ws.diagram, at: new Date().toISOString() });
  }

  const snapshot = () => JSON.stringify(state.ws.diagram);
  function pushUndo(snap) {
    const ws = state.ws;
    ws.undo.push(snap);
    if (ws.undo.length > 100) ws.undo.shift();
    ws.redo = [];
  }
  // Every diagram edit goes through here: one undo entry, re-render, autosave.
  function change(mutate) {
    const snap = snapshot();
    mutate(state.ws.diagram);
    pushUndo(snap);
    afterChange();
  }
  function afterChange() {
    const ws = state.ws;
    if (ws.sel && !findSel(ws.sel)) ws.sel = null;
    renderStage();
    renderProps();
    renderBriefStatus();
    updateBar();
    scheduleSave();
  }
  function undo() {
    const ws = state.ws;
    if (!ws.undo.length) return;
    ws.redo.push(snapshot());
    ws.diagram = JSON.parse(ws.undo.pop());
    afterChange();
  }
  function redo() {
    const ws = state.ws;
    if (!ws.redo.length) return;
    ws.undo.push(snapshot());
    ws.diagram = JSON.parse(ws.redo.pop());
    afterChange();
  }

  function findSel(sel) {
    if (!sel) return null;
    const d = state.ws.diagram;
    const list = sel.kind === 'node' ? d.nodes : sel.kind === 'edge' ? d.edges : d.groups;
    return list.find((x) => x.id === sel.id) || null;
  }
  const nodeById = (id) => state.ws.diagram.nodes.find((n) => n.id === id);

  function newId(prefix) {
    const d = state.ws.diagram;
    const used = new Set([...d.nodes, ...d.edges, ...d.groups].map((x) => x.id));
    let n = d.seq || 1;
    while (used.has(prefix + n)) n++;
    d.seq = n + 1;
    return prefix + n;
  }

  function freeSpot(x, y) {
    const nodes = state.ws.diagram.nodes;
    let guard = 0;
    while (nodes.some((n) => Math.abs(n.x - x) < NW - 16 && Math.abs(n.y - y) < NH) && guard++ < 60) {
      x += 32;
      y += 32;
    }
    return { x, y };
  }
  function listModeSpot() {
    const nodes = state.ws.diagram.nodes;
    for (let row = 0; row < 200; row++) {
      for (let col = 0; col < 4; col++) {
        const x = 48 + col * 224;
        const y = 48 + row * 96;
        if (!nodes.some((n) => Math.abs(n.x - x) < NW && Math.abs(n.y - y) < NH)) return { x, y };
      }
    }
    return { x: 48, y: 48 };
  }

  function addBlock(type, at) {
    const ws = state.ws;
    let pos;
    if (at) pos = freeSpot(snap(at.x - NW / 2), snap(at.y - NH / 2));
    else if (ws.mode === 'list' || !W.svg) pos = listModeSpot();
    else { const c = viewCenter(); pos = freeSpot(snap(c.x - NW / 2), snap(c.y - NH / 2)); }
    let id;
    change((d) => {
      id = newId('n');
      d.nodes.push({ id, type, x: pos.x, y: pos.y, label: CAT.byType[type].label, props: C.defaultProps(type, ws.ch.roles) });
    });
    select({ kind: 'node', id }, true);
  }

  function addGroup(type, at) {
    const def = CAT.groupByType[type];
    const c = at || (W.svg && state.ws.mode === 'canvas' ? viewCenter() : { x: 48 + def.w / 2, y: 48 + def.h / 2 });
    let id;
    change((d) => {
      id = newId('g');
      d.groups.push({ id, type, x: snap(c.x - def.w / 2), y: snap(c.y - def.h / 2), w: def.w, h: def.h, label: def.label });
    });
    select({ kind: 'group', id }, true);
  }

  function connect(from, to) {
    const d = state.ws.diagram;
    if (from === to) { toast('A block can’t connect to itself.'); return; }
    const existing = d.edges.find((e) => e.from === from && e.to === to);
    if (existing) { toast('These blocks are already connected.'); select({ kind: 'edge', id: existing.id }); return; }
    const kind = C.inferEdgeKind(nodeById(from).type, nodeById(to).type);
    let id;
    change((dd) => {
      id = newId('e');
      dd.edges.push({ id, from, to, kind, props: C.defaultEdgeProps() });
    });
    select({ kind: 'edge', id });
  }

  function deleteSelection() {
    const ws = state.ws;
    const sel = ws.sel;
    if (!sel) return;
    if (sel.kind === 'node' && ws.locked.has(sel.id)) {
      toast('This block is part of the starting design, so it can’t be removed. You can change its settings.');
      return;
    }
    change((d) => {
      if (sel.kind === 'node') {
        d.nodes = d.nodes.filter((n) => n.id !== sel.id);
        d.edges = d.edges.filter((e) => e.from !== sel.id && e.to !== sel.id);
      } else if (sel.kind === 'edge') d.edges = d.edges.filter((e) => e.id !== sel.id);
      else d.groups = d.groups.filter((g) => g.id !== sel.id);
    });
    ws.sel = null;
    renderProps();
    if (W.svg) W.svg.focus({ preventScroll: true });
  }

  function duplicateSelection() {
    const ws = state.ws;
    const item = findSel(ws.sel);
    if (!item || ws.sel.kind === 'edge') return;
    let id;
    change((d) => {
      const copy = JSON.parse(JSON.stringify(item));
      copy.x += 32;
      copy.y += 32;
      if (ws.sel.kind === 'node') { id = copy.id = newId('n'); d.nodes.push(copy); } else { id = copy.id = newId('g'); d.groups.push(copy); }
    });
    select({ kind: ws.sel.kind, id }, true);
  }

  function select(sel, focus) {
    const ws = state.ws;
    ws.sel = sel;
    if (W.svg) {
      W.svg.querySelectorAll('.is-sel').forEach((el) => el.classList.remove('is-sel'));
      const map = sel ? (sel.kind === 'node' ? W.nodeEls : sel.kind === 'edge' ? W.edgeEls : W.groupEls) : null;
      const el = map && map.get(sel.id);
      if (el) {
        el.classList.add('is-sel');
        if (sel.kind === 'edge') {
          const line = el.querySelector('.line');
          line.setAttribute('marker-end', `url(#ed-${findSel(sel).kind}-sel)`);
        }
        if (focus && ws.mode === 'canvas') el.focus({ preventScroll: true });
      }
      W.svg.querySelectorAll('.edge:not(.is-sel) .line').forEach((line) => {
        const e = state.ws.diagram.edges.find((x) => x.id === line.parentNode.dataset.id);
        if (e) line.setAttribute('marker-end', `url(#ed-${e.kind})`);
      });
    }
    if (ws.mode === 'list') renderStage();
    renderProps();
  }

  /* ---- [APP:EDITOR:DRAW] ---- */
  function markerDefs(prefix) {
    const defs = [];
    const add = (name, d, w, open, sel) => defs.push(s('marker', {
      id: `${prefix}-${name}${sel ? '-sel' : ''}`, viewBox: `0 0 ${w} 10`, refX: w - 0.5, refY: 5,
      markerWidth: w * 1.1, markerHeight: 11, markerUnits: 'userSpaceOnUse', orient: 'auto-start-reverse',
      class: sel ? 'marker-sel' : null,
    }, s('path', { d, class: open ? 'marker-open' : 'marker-fill' })));
    for (const sel of [false, true]) {
      add('sync', 'M0 0L10 5L0 10z', 10, false, sel);
      add('async', 'M1 1L9 5L1 9', 10, true, sel);
      add('replication', 'M0 0L6 5L0 10z M5 0L11 5L5 10z', 11, false, sel);
      add('data', 'M0 0L10 5L0 10z', 10, false, sel);
    }
    return defs;
  }

  function roundedPath(pts, r) {
    const p = pts.filter((q, i) => i === 0 || q[0] !== pts[i - 1][0] || q[1] !== pts[i - 1][1]);
    const f = (v) => Math.round(v * 10) / 10;
    let d = `M${f(p[0][0])} ${f(p[0][1])}`;
    for (let i = 1; i < p.length - 1; i++) {
      const [px, py] = p[i - 1];
      const [cx, cy] = p[i];
      const [nx, ny] = p[i + 1];
      const l1 = Math.hypot(cx - px, cy - py);
      const l2 = Math.hypot(nx - cx, ny - cy);
      const rr = Math.min(r, l1 / 2, l2 / 2);
      d += ` L${f(cx - ((cx - px) / l1) * rr)} ${f(cy - ((cy - py) / l1) * rr)}`;
      d += ` Q${f(cx)} ${f(cy)} ${f(cx + ((nx - cx) / l2) * rr)} ${f(cy + ((ny - cy) / l2) * rr)}`;
    }
    const last = p[p.length - 1];
    return d + ` L${f(last[0])} ${f(last[1])}`;
  }

  // Orthogonal elbows between the nearest sides; opposite-direction pairs are offset apart.
  function routeEdge(a, b, offset) {
    const hGap = Math.max(b.x - (a.x + NW), a.x - (b.x + NW));
    const vGap = Math.max(b.y - (a.y + NH), a.y - (b.y + NH));
    const acx = a.x + NW / 2;
    const acy = a.y + NH / 2;
    const bcx = b.x + NW / 2;
    const bcy = b.y + NH / 2;
    let pts;
    if ((hGap >= 24 && (hGap >= vGap || vGap < 24)) || (hGap < 24 && vGap < 24)) {
      const right = bcx >= acx;
      const sx = right ? a.x + NW : a.x;
      const tx = right ? b.x : b.x + NW;
      const mx = Math.round((sx + tx) / 2);
      pts = [[sx, acy + offset], [mx, acy + offset], [mx, bcy + offset], [tx, bcy + offset]];
    } else {
      const down = bcy >= acy;
      const sy = down ? a.y + NH : a.y;
      const ty = down ? b.y : b.y + NH;
      const my = Math.round((sy + ty) / 2);
      pts = [[acx + offset, sy], [acx + offset, my], [bcx + offset, my], [bcx + offset, ty]];
    }
    return { d: roundedPath(pts, 10), mid: [(pts[1][0] + pts[2][0]) / 2, (pts[1][1] + pts[2][1]) / 2] };
  }

  function edgeBadgeText(e) {
    if (e.kind !== 'sync') return '';
    const p = e.props || {};
    const parts = [];
    if (p.timeoutMs > 0) parts.push(p.timeoutMs >= 1000 ? `${+(p.timeoutMs / 1000).toFixed(1)}s` : `${p.timeoutMs}ms`);
    if (p.retries > 0) parts.push(`${p.retries}× retry${p.backoff ? '+b' : ''}${p.jitter ? '+j' : ''}`);
    if (p.circuitBreaker) parts.push('breaker');
    return parts.join(' · ');
  }

  function truncate(str, n) {
    return str.length > n ? str.slice(0, n - 1) + '…' : str;
  }

  function nodeSubline(n) {
    const def = CAT.byType[n.type];
    const parts = [];
    if (n.label !== def.label) parts.push(def.label);
    const p = n.props || {};
    if (p.role) parts.push(p.role);
    if (p.replicas > 1) parts.push(`×${p.replicas}`);
    const category = CAT.categories.find((c) => c.id === def.category);
    return truncate(parts.join(' · ') || category.label, 26);
  }

  function drawNode(n, opts) {
    const def = CAT.byType[n.type];
    const interactive = opts.interactive;
    const locked = interactive && state.ws.locked.has(n.id);
    const g = s('g', {
      class: `node cat-${def.category}`, 'data-id': n.id, transform: `translate(${n.x} ${n.y})`,
      tabindex: interactive ? 0 : null, role: interactive ? 'button' : null,
      'aria-label': interactive ? `${n.label}, ${def.label}${locked ? ', locked' : ''}` : null,
    },
    s('title', null, n.label === def.label ? def.label : `${n.label} — ${def.label}`),
    s('rect', { class: 'box', width: NW, height: NH, rx: 6 }),
    s('path', { class: 'stripe', d: `M7 0V${NH}H6A6 6 0 0 1 0 ${NH - 6}V6A6 6 0 0 1 6 0Z` }),
    s('g', { class: 'glyph', transform: `translate(15 ${NH / 2 - 10})` }, s('path', { d: def.glyph })),
    s('text', { class: 'label', x: 44, y: 28 }, truncate(n.label, 17)),
    s('text', { class: 'sub', x: 44, y: 46 }, nodeSubline(n)));
    if (locked) g.append(s('path', { class: 'lock', d: 'M143 14h9v7h-9z M145 14v-2.5a2.5 2.5 0 0 1 5 0V14' }));
    if (interactive) {
      for (const [cx, cy] of [[NW / 2, 0], [NW, NH / 2], [NW / 2, NH], [0, NH / 2]]) {
        g.append(s('circle', { class: 'port', cx, cy, r: 6.5 }));
      }
    }
    return g;
  }

  function drawEdge(e, byId, pairSet, prefix, selected) {
    const a = byId.get(e.from);
    const b = byId.get(e.to);
    const offset = pairSet.has(e.to + '>' + e.from) ? (e.from < e.to ? 7 : -7) : 0;
    const r = routeEdge(a, b, offset);
    const g = s('g', { class: `edge k-${e.kind}${selected ? ' is-sel' : ''}`, 'data-id': e.id });
    g.append(s('path', { class: 'hit', d: r.d }), s('path', { class: 'line', d: r.d, 'marker-end': `url(#${prefix}-${e.kind}${selected ? '-sel' : ''})` }));
    const badge = edgeBadgeText(e);
    if (badge) {
      const w = badge.length * 5.6 + 10;
      g.append(s('rect', { class: 'edge-badge', x: r.mid[0] - w / 2, y: r.mid[1] - 8, width: w, height: 16, rx: 8 }),
        s('text', { class: 'edge-badge-text', x: r.mid[0], y: r.mid[1] + 3.5, 'text-anchor': 'middle' }, badge));
    }
    return g;
  }

  function drawGroup(gr, opts) {
    const def = CAT.groupByType[gr.type];
    const tabW = Math.min(gr.w - 20, gr.label.length * 6.4 + 22);
    const g = s('g', {
      class: `group t-${gr.type}`, 'data-id': gr.id,
      tabindex: opts.interactive ? 0 : null, role: opts.interactive ? 'button' : null,
      'aria-label': opts.interactive ? `${gr.label}, ${def.label} area` : null,
    },
    s('rect', { class: 'frame', x: gr.x, y: gr.y, width: gr.w, height: gr.h, rx: 10 }),
    opts.interactive ? s('rect', { class: 'frame-hit', x: gr.x, y: gr.y, width: gr.w, height: gr.h, rx: 10 }) : null,
    s('rect', { class: 'tab', x: gr.x + 12, y: gr.y - 11, width: Math.max(40, tabW), height: 22, rx: 4 }),
    s('text', { class: 'tab-text', x: gr.x + 22, y: gr.y + 4 }, truncate(gr.label, Math.max(4, Math.floor((gr.w - 40) / 6.4)))));
    if (opts.interactive) {
      for (const [corner, x, y] of [['nw', gr.x, gr.y], ['ne', gr.x + gr.w, gr.y], ['sw', gr.x, gr.y + gr.h], ['se', gr.x + gr.w, gr.y + gr.h]]) {
        g.append(s('rect', { class: `handle ${corner === 'nw' || corner === 'se' ? 'nwse' : 'nesw'}`, 'data-corner': corner, x: x - 6, y: y - 6, width: 12, height: 12, rx: 2 }));
      }
    }
    return g;
  }

  // Shared by the editor, "Show solution" and SVG/PNG export.
  function drawDiagram(layers, d, opts) {
    const byId = new Map(d.nodes.map((n) => [n.id, n]));
    const pairs = new Set(d.edges.map((e) => e.from + '>' + e.to));
    const sel = opts.sel || null;
    const maps = { nodeEls: new Map(), edgeEls: new Map(), groupEls: new Map() };
    for (const gr of d.groups) {
      const el = drawGroup(gr, opts);
      if (sel && sel.kind === 'group' && sel.id === gr.id) el.classList.add('is-sel');
      maps.groupEls.set(gr.id, el);
      layers.groups.append(el);
    }
    for (const e of d.edges) {
      if (!byId.has(e.from) || !byId.has(e.to)) continue;
      const el = drawEdge(e, byId, pairs, opts.prefix, sel && sel.kind === 'edge' && sel.id === e.id);
      if (opts.interactive) {
        el.setAttribute('tabindex', '0');
        el.setAttribute('role', 'button');
        el.setAttribute('aria-label', `Connection from ${byId.get(e.from).label} to ${byId.get(e.to).label}, ${e.kind}`);
      }
      maps.edgeEls.set(e.id, el);
      layers.edges.append(el);
    }
    for (const n of d.nodes) {
      const el = drawNode(n, opts);
      if (sel && sel.kind === 'node' && sel.id === n.id) el.classList.add('is-sel');
      maps.nodeEls.set(n.id, el);
      layers.nodes.append(el);
    }
    return maps;
  }

  function diagramBounds(d) {
    let x0 = Infinity; let y0 = Infinity; let x1 = -Infinity; let y1 = -Infinity;
    for (const n of d.nodes) { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x + NW); y1 = Math.max(y1, n.y + NH); }
    for (const g of d.groups) { x0 = Math.min(x0, g.x); y0 = Math.min(y0, g.y - 12); x1 = Math.max(x1, g.x + g.w); y1 = Math.max(y1, g.y + g.h); }
    return x0 === Infinity ? null : { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  }

  // minSize keeps a tiny diagram from being blown up to fill a large frame.
  function staticSvg(d, prefix, cls, minSize) {
    const b = diagramBounds(d) || { x: 0, y: 0, w: 400, h: 200 };
    const pad = 24;
    const vw = Math.max(b.w + 2 * pad, minSize ? minSize.w : 0);
    const vh = Math.max(b.h + 2 * pad, minSize ? minSize.h : 0);
    const vx = b.x + b.w / 2 - vw / 2;
    const vy = b.y + b.h / 2 - vh / 2;
    const svg = s('svg', { xmlns: SVGNS, class: cls || null, viewBox: `${vx} ${vy} ${vw} ${vh}`, role: 'img' });
    const layers = { groups: s('g'), edges: s('g'), nodes: s('g') };
    svg.append(s('defs', null, markerDefs(prefix)), layers.groups, layers.edges, layers.nodes);
    drawDiagram(layers, d, { interactive: false, prefix });
    return { svg, bounds: b, pad };
  }

  /* ---- [APP:EDITOR:CANVAS] ---- */
  let W = null; // DOM refs of the open workspace

  function buildCanvas() {
    const svg = s('svg', {
      class: 'canvas', tabindex: 0, role: 'application', 'aria-roledescription': 'diagram editor',
      'aria-label': 'Diagram canvas. Tab through blocks; Enter edits, C connects, Delete removes, arrows move.',
    });
    const defs = s('defs', null,
      s('pattern', { id: 'bp-grid-minor', width: GRID, height: GRID, patternUnits: 'userSpaceOnUse' }, s('path', { class: 'grid-minor', d: `M${GRID} 0H0V${GRID}` })),
      s('pattern', { id: 'bp-grid-major', width: GRID * 5, height: GRID * 5, patternUnits: 'userSpaceOnUse' }, s('path', { class: 'grid-major', d: `M${GRID * 5} 0H0V${GRID * 5}` })),
      markerDefs('ed'));
    const gridMinor = s('rect', { width: '100%', height: '100%', fill: 'url(#bp-grid-minor)' });
    const gridMajor = s('rect', { width: '100%', height: '100%', fill: 'url(#bp-grid-major)' });
    const viewport = s('g', { class: 'viewport' });
    const layers = { groups: s('g'), edges: s('g'), nodes: s('g'), overlay: s('g') };
    viewport.append(layers.groups, layers.edges, layers.nodes, layers.overlay);
    svg.append(defs, gridMinor, gridMajor, viewport);
    Object.assign(W, { svg, viewport, layers, patterns: [defs.children[0], defs.children[1]], nodeEls: new Map(), edgeEls: new Map(), groupEls: new Map() });

    svg.addEventListener('pointerdown', onPointerDown);
    svg.addEventListener('pointermove', onPointerMove);
    svg.addEventListener('pointerup', onPointerUp);
    svg.addEventListener('pointercancel', onPointerCancel);
    svg.addEventListener('wheel', onWheel, { passive: false });
    svg.addEventListener('dragover', (ev) => {
      if (ev.dataTransfer && [...ev.dataTransfer.types].includes('application/x-blockprint')) {
        ev.preventDefault();
        ev.dataTransfer.dropEffect = 'copy';
      }
    });
    svg.addEventListener('drop', (ev) => {
      const type = ev.dataTransfer && ev.dataTransfer.getData('application/x-blockprint');
      if (!type) return;
      ev.preventDefault();
      ev.stopPropagation();
      const at = toWorld(ev.clientX, ev.clientY);
      if (CAT.groupByType[type]) addGroup(type, at); else if (CAT.byType[type]) addBlock(type, at);
    });
    svg.addEventListener('focusin', (ev) => {
      const el = ev.target.closest && ev.target.closest('.node, .edge, .group');
      if (!el) return;
      const kind = el.classList.contains('node') ? 'node' : el.classList.contains('edge') ? 'edge' : 'group';
      const cur = state.ws.sel;
      if (!cur || cur.kind !== kind || cur.id !== el.dataset.id) select({ kind, id: el.dataset.id });
    });
    return svg;
  }

  function renderCanvas() {
    const ws = state.ws;
    const L = W.layers;
    const hadFocus = W.svg.contains(document.activeElement);
    fill(L.groups);
    fill(L.edges);
    fill(L.nodes);
    const maps = drawDiagram(L, ws.diagram, { interactive: true, prefix: 'ed', sel: ws.sel });
    Object.assign(W, maps);
    W.svg.classList.toggle('is-connecting', !!ws.connectFrom);
    if (hadFocus) {
      const map = ws.sel ? (ws.sel.kind === 'node' ? W.nodeEls : ws.sel.kind === 'edge' ? W.edgeEls : W.groupEls) : null;
      const el = map && map.get(ws.sel.id);
      (el || W.svg).focus({ preventScroll: true });
    }
    updateHud();
  }

  function applyView() {
    const v = state.ws.view;
    const t = `translate(${v.x} ${v.y}) scale(${v.k})`;
    W.viewport.setAttribute('transform', t);
    W.patterns.forEach((p) => p.setAttribute('patternTransform', t));
    updateHud();
  }

  function updateHud() {
    if (!W || !W.hud) return;
    const ws = state.ws;
    const cost = C.diagramCost(ws.diagram);
    const budget = ws.ch.budget;
    fill(W.hud,
      h('span', { class: 'pill' }, `${Math.round(ws.view.k * 100)}%`),
      h('span', { class: 'pill' }, budget ? `Cost ${cost} of ${budget}` : `Cost ${cost}`));
    W.empty.hidden = ws.diagram.nodes.length > 0 || ws.diagram.groups.length > 0;
    W.banner.hidden = !ws.connectFrom;
  }

  function toWorld(cx, cy) {
    const r = W.svg.getBoundingClientRect();
    const v = state.ws.view;
    return { x: (cx - r.left - v.x) / v.k, y: (cy - r.top - v.y) / v.k };
  }
  function viewCenter() {
    const r = W.svg.getBoundingClientRect();
    return toWorld(r.left + r.width / 2, r.top + r.height / 2);
  }
  function zoomAt(k, sx, sy) {
    const v = state.ws.view;
    const nk = clamp(k, ZOOM_MIN, ZOOM_MAX);
    v.x = sx - ((sx - v.x) * nk) / v.k;
    v.y = sy - ((sy - v.y) * nk) / v.k;
    v.k = nk;
    applyView();
  }
  function fitView() {
    if (!W || !W.svg) return;
    const ws = state.ws;
    const r = W.svg.getBoundingClientRect();
    const b = diagramBounds(ws.diagram);
    if (!b || !r.width) { ws.view = { x: 0, y: 0, k: 1 }; applyView(); return; }
    const k = clamp(Math.min((r.width - 80) / b.w, (r.height - 80) / b.h, 1.25), ZOOM_MIN, ZOOM_MAX);
    ws.view = { k, x: (r.width - b.w * k) / 2 - b.x * k, y: (r.height - b.h * k) / 2 - b.y * k };
    applyView();
  }

  /* ---- [APP:EDITOR:POINTER] ---- */
  let gesture = null;
  const pointers = new Map();

  function cancelGesture() {
    if (gesture && gesture.cancel) gesture.cancel();
    gesture = null;
    pointers.clear();
  }

  function onPointerDown(ev) {
    const ws = state.ws;
    if (ev.pointerType === 'mouse' && ev.button !== 0 && ev.button !== 1) return;
    pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    try { W.svg.setPointerCapture(ev.pointerId); } catch (e) { /* capture is best-effort */ }
    if (pointers.size === 2) {
      if (gesture && gesture.finish) gesture.finish();
      gesture = pinchGesture();
      return;
    }
    if (pointers.size > 2) return;
    ev.preventDefault();
    const t = ev.target;
    const nodeEl = t.closest('.node');
    if (ev.button === 1) { gesture = panGesture(ev, false); return; }
    if (ws.connectFrom) {
      if (nodeEl) connect(ws.connectFrom, nodeEl.dataset.id);
      ws.connectFrom = null;
      updateHud();
      W.svg.classList.remove('is-connecting');
      gesture = null;
      return;
    }
    const port = t.closest('.port');
    const handle = t.closest('.handle');
    const groupEl = t.closest('.group');
    const edgeEl = t.closest('.edge');
    if (port && nodeEl) {
      gesture = connectGesture(nodeEl.dataset.id, ev);
    } else if (nodeEl) {
      select({ kind: 'node', id: nodeEl.dataset.id });
      nodeEl.focus({ preventScroll: true });
      gesture = moveGesture(ev, [nodeEl.dataset.id], []);
    } else if (handle && groupEl) {
      select({ kind: 'group', id: groupEl.dataset.id });
      gesture = resizeGesture(ev, groupEl.dataset.id, handle.dataset.corner);
    } else if (groupEl) {
      const id = groupEl.dataset.id;
      select({ kind: 'group', id });
      groupEl.focus({ preventScroll: true });
      const gr = findSel({ kind: 'group', id });
      const inside = (x, y) => x >= gr.x && x <= gr.x + gr.w && y >= gr.y && y <= gr.y + gr.h;
      const nodes = ws.diagram.nodes.filter((n) => inside(n.x + NW / 2, n.y + NH / 2)).map((n) => n.id);
      const groups = ws.diagram.groups.filter((o) => o.id === id || (inside(o.x, o.y) && inside(o.x + o.w, o.y + o.h))).map((o) => o.id);
      gesture = moveGesture(ev, nodes, groups);
    } else if (edgeEl) {
      select({ kind: 'edge', id: edgeEl.dataset.id });
      edgeEl.focus({ preventScroll: true });
      gesture = null;
    } else {
      W.svg.focus({ preventScroll: true });
      gesture = panGesture(ev, true);
    }
  }
  function onPointerMove(ev) {
    if (!pointers.has(ev.pointerId)) return;
    pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (gesture && gesture.move) gesture.move(ev);
  }
  function onPointerUp(ev) {
    if (!pointers.has(ev.pointerId)) return;
    pointers.delete(ev.pointerId);
    if (gesture && gesture.pinch) { if (pointers.size < 2) gesture = null; return; }
    if (gesture && gesture.up) gesture.up(ev);
    gesture = null;
  }
  function onPointerCancel(ev) {
    pointers.delete(ev.pointerId);
    if (gesture && gesture.cancel) gesture.cancel();
    gesture = null;
  }

  function panGesture(ev, clearOnClick) {
    const v = state.ws.view;
    const start = { x: ev.clientX, y: ev.clientY, vx: v.x, vy: v.y };
    let moved = false;
    return {
      move(e) {
        const dx = e.clientX - start.x;
        const dy = e.clientY - start.y;
        if (!moved && Math.hypot(dx, dy) < 3) return;
        moved = true;
        W.svg.classList.add('is-panning');
        v.x = start.vx + dx;
        v.y = start.vy + dy;
        applyView();
      },
      up() {
        W.svg.classList.remove('is-panning');
        if (!moved && clearOnClick) select(null);
      },
      cancel() { W.svg.classList.remove('is-panning'); },
    };
  }

  function pinchGesture() {
    const [a, b] = [...pointers.values()];
    const v = state.ws.view;
    const r = W.svg.getBoundingClientRect();
    const d0 = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    const mid0 = { x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top };
    const world = { x: (mid0.x - v.x) / v.k, y: (mid0.y - v.y) / v.k };
    const k0 = v.k;
    return {
      pinch: true,
      move() {
        const [p, q] = [...pointers.values()];
        if (!q) return;
        const k = clamp((k0 * Math.hypot(p.x - q.x, p.y - q.y)) / d0, ZOOM_MIN, ZOOM_MAX);
        const mid = { x: (p.x + q.x) / 2 - r.left, y: (p.y + q.y) / 2 - r.top };
        v.k = k;
        v.x = mid.x - world.x * k;
        v.y = mid.y - world.y * k;
        applyView();
      },
    };
  }

  // Moves nodes and groups together (a group drags what it contains). One undo entry per drag.
  function moveGesture(ev, nodeIds, groupIds) {
    const ws = state.ws;
    const snap0 = snapshot();
    const start = { x: ev.clientX, y: ev.clientY };
    const nodes = nodeIds.map((id) => nodeById(id));
    const groups = groupIds.map((id) => ws.diagram.groups.find((g) => g.id === id));
    const origin = [...nodes, ...groups].map((o) => ({ o, x: o.x, y: o.y }));
    const lead = origin[0];
    const touched = new Set(nodeIds);
    let moved = false;
    return {
      move(e) {
        const dx = (e.clientX - start.x) / ws.view.k;
        const dy = (e.clientY - start.y) / ws.view.k;
        if (!moved && Math.hypot(e.clientX - start.x, e.clientY - start.y) < 3) return;
        moved = true;
        W.svg.classList.add('is-dragging');
        // Snap the lead item and move the rest by the same amount, keeping relative positions.
        const sx = snap(lead.x + dx, e.altKey) - lead.x;
        const sy = snap(lead.y + dy, e.altKey) - lead.y;
        for (const it of origin) { it.o.x = it.x + sx; it.o.y = it.y + sy; }
        for (const n of nodes) W.nodeEls.get(n.id).setAttribute('transform', `translate(${n.x} ${n.y})`);
        for (const g of groups) redrawGroup(g);
        redrawEdgesFor(touched);
      },
      up() {
        W.svg.classList.remove('is-dragging');
        if (!moved) return;
        pushUndo(snap0);
        afterChange();
      },
      cancel() {
        W.svg.classList.remove('is-dragging');
        if (moved) { pushUndo(snap0); afterChange(); }
      },
      finish() { this.cancel(); },
    };
  }

  function resizeGesture(ev, id, corner) {
    const ws = state.ws;
    const snap0 = snapshot();
    const g = ws.diagram.groups.find((x) => x.id === id);
    const o = { x: g.x, y: g.y, w: g.w, h: g.h };
    const start = { x: ev.clientX, y: ev.clientY };
    let moved = false;
    return {
      move(e) {
        const dx = (e.clientX - start.x) / ws.view.k;
        const dy = (e.clientY - start.y) / ws.view.k;
        moved = true;
        let x0 = o.x; let y0 = o.y; let x1 = o.x + o.w; let y1 = o.y + o.h;
        if (corner.includes('w')) x0 = Math.min(snap(o.x + dx, e.altKey), x1 - 160);
        if (corner.includes('e')) x1 = Math.max(snap(x1 + dx, e.altKey), x0 + 160);
        if (corner.includes('n')) y0 = Math.min(snap(o.y + dy, e.altKey), y1 - 96);
        if (corner.includes('s')) y1 = Math.max(snap(y1 + dy, e.altKey), y0 + 96);
        Object.assign(g, { x: x0, y: y0, w: x1 - x0, h: y1 - y0 });
        redrawGroup(g);
      },
      up() { if (moved) { pushUndo(snap0); afterChange(); } },
      cancel() { if (moved) { pushUndo(snap0); afterChange(); } },
    };
  }

  function connectGesture(fromId, ev) {
    const a = nodeById(fromId);
    const origin = { x: a.x + NW / 2, y: a.y + NH / 2 };
    const line = s('path', { class: 'preview' });
    W.layers.overlay.append(line);
    const start = { x: ev.clientX, y: ev.clientY };
    let target = null;
    let moved = false;
    const setTarget = (el) => {
      if (target === el) return;
      if (target) target.classList.remove('is-target');
      target = el;
      if (target) target.classList.add('is-target');
    };
    const cleanup = () => { line.remove(); setTarget(null); };
    return {
      move(e) {
        if (!moved && Math.hypot(e.clientX - start.x, e.clientY - start.y) < 4) return;
        moved = true;
        const p = toWorld(e.clientX, e.clientY);
        line.setAttribute('d', `M${origin.x} ${origin.y}L${p.x} ${p.y}`);
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const nodeEl = el && el.closest && el.closest('.node');
        setTarget(nodeEl && nodeEl.dataset.id !== fromId ? nodeEl : null);
      },
      up() {
        const to = target && target.dataset.id;
        cleanup();
        if (!moved) {
          // A tap on a handle starts click-to-connect (useful on touch screens).
          startConnectMode(fromId);
          return;
        }
        if (to) connect(fromId, to);
      },
      cancel: cleanup,
    };
  }

  function startConnectMode(id) {
    const ws = state.ws;
    ws.connectFrom = id;
    select({ kind: 'node', id });
    W.svg.classList.add('is-connecting');
    updateHud();
  }

  function redrawEdgesFor(nodeIds) {
    const d = state.ws.diagram;
    const byId = new Map(d.nodes.map((n) => [n.id, n]));
    const pairs = new Set(d.edges.map((e) => e.from + '>' + e.to));
    for (const e of d.edges) {
      if (!nodeIds.has(e.from) && !nodeIds.has(e.to)) continue;
      const old = W.edgeEls.get(e.id);
      if (!old) continue;
      const sel = state.ws.sel && state.ws.sel.kind === 'edge' && state.ws.sel.id === e.id;
      const el = drawEdge(e, byId, pairs, 'ed', sel);
      old.replaceWith(el);
      W.edgeEls.set(e.id, el);
    }
  }
  function redrawGroup(g) {
    const old = W.groupEls.get(g.id);
    const el = drawGroup(g, { interactive: true });
    if (old && old.classList.contains('is-sel')) el.classList.add('is-sel');
    if (old) old.replaceWith(el);
    W.groupEls.set(g.id, el);
  }

  function onWheel(ev) {
    ev.preventDefault();
    const r = W.svg.getBoundingClientRect();
    const factor = Math.exp(-ev.deltaY * (ev.deltaMode === 1 ? 0.05 : 0.0018));
    zoomAt(state.ws.view.k * factor, ev.clientX - r.left, ev.clientY - r.top);
  }

  /* ---- [APP:EDITOR:KEYS] ---- */
  function onKeyDown(ev) {
    const ws = state.ws;
    if (!ws || !W || $('#sheet').open) return;
    const t = ev.target;
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName) || t.isContentEditable;
    const mod = ev.ctrlKey || ev.metaKey;
    const key = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
    if (mod && key === 'z' && !typing) { ev.preventDefault(); if (ev.shiftKey) redo(); else undo(); return; }
    if (mod && key === 'y' && !typing) { ev.preventDefault(); redo(); return; }
    if (typing) { if (key === 'Escape') t.blur(); return; }
    if (mod && key === 'd') { ev.preventDefault(); duplicateSelection(); return; }
    if (mod || ev.altKey) return;
    const inCanvas = W.svg && W.svg.contains(t);
    if (key === 'Escape') {
      if (ws.connectFrom) { ws.connectFrom = null; W.svg.classList.remove('is-connecting'); updateHud(); return; }
      if (ws.drawer) { setDrawer(null); return; }
      if (menuOpen()) { closeMenu(); return; }
      select(null);
      if (W.svg) W.svg.focus({ preventScroll: true });
      return;
    }
    if ((key === 'Delete' || key === 'Backspace') && (inCanvas || t === document.body)) { ev.preventDefault(); deleteSelection(); return; }
    if (!inCanvas) return;
    if (key === 'Enter' || key === ' ') {
      const nodeEl = t.closest && t.closest('.node');
      if (ws.connectFrom && nodeEl) { ev.preventDefault(); const from = ws.connectFrom; ws.connectFrom = null; connect(from, nodeEl.dataset.id); return; }
      if (key === 'Enter' && ws.sel) { ev.preventDefault(); focusProps(); }
      return;
    }
    if (key === 'c' && ws.sel && ws.sel.kind === 'node') { ev.preventDefault(); startConnectMode(ws.sel.id); toast('Choose the block to connect to (Tab to it and press Enter). Esc cancels.'); return; }
    if (key === 'f') { ev.preventDefault(); fitView(); return; }
    const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (arrows[key] && ws.sel && ws.sel.kind !== 'edge') {
      ev.preventDefault();
      const step = GRID * (ev.shiftKey ? 5 : 1);
      const [dx, dy] = arrows[key];
      const id = ws.sel.id;
      const kind = ws.sel.kind;
      change((d) => {
        const it = (kind === 'node' ? d.nodes : d.groups).find((x) => x.id === id);
        it.x += dx * step;
        it.y += dy * step;
      });
    }
  }

  function focusProps() {
    if (window.innerWidth <= 900) setDrawer('props');
    const first = W.props.querySelector('input, select, textarea');
    if (first) first.focus();
  }

  /* ---- [APP:EDITOR:LIST] ---- */
  // List mode: a complete alternative editor over the same diagram data and validator.
  function renderList() {
    const ws = state.ws;
    const d = ws.diagram;
    const pal = C.resolvePalette(state.pack, ws.ch);
    const isSel = (kind, id) => ws.sel && ws.sel.kind === kind && ws.sel.id === id;
    const nodeOptions = (selected) => d.nodes.map((n) => h('option', { value: n.id, selected: n.id === selected }, `${n.label} (${CAT.byType[n.type].label})`));
    const editBtn = (sel, name) => btn('Edit', () => { select(sel); focusProps(); }, { cls: 'btn-sm', aria: `Edit ${name}` });

    const blockRows = d.nodes.map((n) => {
      const def = CAT.byType[n.type];
      const locked = ws.locked.has(n.id);
      return h('div', { class: `lrow cat-${def.category}${isSel('node', n.id) ? ' is-sel' : ''}` },
        glyph(n.type, 20),
        h('input', {
          type: 'text', value: n.label, 'aria-label': `Label of ${def.label}`, 'data-field': `label-${n.id}`,
          onchange: (e) => change((dd) => { dd.nodes.find((x) => x.id === n.id).label = e.target.value.trim() || def.label; }),
        }),
        h('span', { class: 'muted' }, nodeSubline(n) === def.label ? def.label : `${def.label} · ${nodeSubline(n)}`, locked ? ' · locked' : ''),
        h('span', { class: 'lbtns' }, editBtn({ kind: 'node', id: n.id }, n.label),
          btn('Delete', () => { select({ kind: 'node', id: n.id }); deleteSelection(); }, { cls: 'btn-sm btn-danger', disabled: locked, aria: `Delete ${n.label}` })));
    });
    const typeSelect = h('select', { 'aria-label': 'Block type to add' }, pal.blocks.map((t) => h('option', { value: t }, CAT.byType[t].label)));
    const addBlockRow = h('div', { class: 'ladd' }, typeSelect, btn('Add block', () => addBlock(typeSelect.value), { cls: 'btn-sm' }));

    const edgeRows = d.edges.map((e) => {
      const retarget = (end) => (ev) => {
        const v = ev.target.value;
        const from = end === 'from' ? v : e.from;
        const to = end === 'to' ? v : e.to;
        if (from === to) { toast('A block can’t connect to itself.'); renderList(); return; }
        if (d.edges.some((x) => x !== e && x.from === from && x.to === to)) { toast('These blocks are already connected.'); renderList(); return; }
        change((dd) => { const x = dd.edges.find((y) => y.id === e.id); x.from = from; x.to = to; });
      };
      return h('div', { class: `lrow lrow-edge${isSel('edge', e.id) ? ' is-sel' : ''}` },
        h('select', { 'aria-label': 'From', 'data-field': `from-${e.id}`, onchange: retarget('from') }, nodeOptions(e.from)),
        h('select', { 'aria-label': 'To', 'data-field': `to-${e.id}`, onchange: retarget('to') }, nodeOptions(e.to)),
        h('select', {
          'aria-label': 'Kind', 'data-field': `kind-${e.id}`,
          onchange: (ev) => change((dd) => { dd.edges.find((y) => y.id === e.id).kind = ev.target.value; }),
        }, CAT.edgeKinds.map((k) => h('option', { value: k.kind, selected: k.kind === e.kind }, k.label))),
        h('span', { class: 'lbtns' }, editBtn({ kind: 'edge', id: e.id }, 'connection'),
          btn('Delete', () => change((dd) => { dd.edges = dd.edges.filter((y) => y.id !== e.id); }), { cls: 'btn-sm btn-danger', aria: 'Delete connection' })));
    });
    const fromSel = h('select', { 'aria-label': 'New connection from' }, nodeOptions());
    const toSel = h('select', { 'aria-label': 'New connection to' }, nodeOptions(d.nodes[1] && d.nodes[1].id));
    const addEdgeRow = d.nodes.length >= 2
      ? h('div', { class: 'ladd' }, h('span', null, 'From'), fromSel, h('span', null, 'to'), toSel, btn('Add connection', () => connect(fromSel.value, toSel.value), { cls: 'btn-sm' }))
      : h('p', { class: 'muted' }, 'Add at least two blocks to connect them.');

    const groupRows = d.groups.map((g) => {
      const def = CAT.groupByType[g.type];
      const inside = (n) => C.groupsContaining(d, n).some((x) => x.id === g.id);
      return h('div', { class: `lrow cat-group${isSel('group', g.id) ? ' is-sel' : ''}` },

            n.label))) : null);
    });

  }

  // Membership is geometric, so list mode moves the block into (or out of) the area.
  function setMembership(groupId, nodeId, inside) {
    change((d) => {
      const g = d.groups.find((x) => x.id === groupId);
      const n = d.nodes.find((x) => x.id === nodeId);
      const others = d.nodes.filter((x) => x !== n);
      if (inside) {
        let spot = null;
        for (let y = g.y + 32; y + NH / 2 <= g.y + g.h && !spot; y += 80) {
          for (let x = g.x + 16; x + NW / 2 <= g.x + g.w && !spot; x += NW + 16) {
            if (!others.some((o) => Math.abs(o.x - x) < NW && Math.abs(o.y - y) < NH)) spot = { x, y };
          }
        }
        spot = spot || { x: g.x + g.w / 2 - NW / 2, y: g.y + g.h / 2 - NH / 2 };
        n.x = snap(spot.x);
        n.y = snap(spot.y);
      } else {
        const right = Math.max(...d.groups.map((x) => x.x + x.w), ...others.map((o) => o.x + NW), 0);
        n.x = snap(right + 48);
      }
    });
  }

  function withFocusKept(container, fn) {
    const a = document.activeElement;
    const field = a && container.contains(a) && a.dataset ? a.dataset.field : null;
    fn();
    if (field) {
      const el = container.querySelector(`[data-field="${CSS.escape(field)}"]`);
      if (el) el.focus();
    }
  }

    const ws = state.ws;
    const q = ws.palQuery.trim().toLowerCase();

    const item = (type, def, isGroup) => h('button', {
      type: 'button', draggable: 'true',
      class: `pal-item cat-${isGroup ? 'group' : def.category}${isGroup ? ' is-group' : ''}`,

      onclick: () => (isGroup ? addGroup(type) : addBlock(type)),
      ondragstart: (ev) => { ev.dataTransfer.setData('application/x-blockprint', type); ev.dataTransfer.effectAllowed = 'copy'; },
    }, glyph(type, 18), def.label);
    if (ws.palCat !== 'groups') {
      for (const t of W.palette.blocks) {
        const def = CAT.byType[t];
        if ((ws.palCat === 'all' || def.category === ws.palCat) && matches(t, def.label)) items.push(item(t, def, false));
      }

    if (ws.palCat === 'all' || ws.palCat === 'groups') {
      for (const t of W.palette.groups) {
        const def = CAT.groupByType[t];

  function renderBriefStatus() {
    if (!W || !W.checklist) return;
    const ws = state.ws;

    fill(W.checklist, ...ch.expected.rules.filter((r) => r.severity !== 'warn').map((rule) => {

        h('div', null,

          inline(rule.text), rule.severity === 'bonus' ? h('span', { class: 'tag' }, 'bonus') : null),

  // After the 3rd failed check: offer to name one block type the design is missing.
  function missingBlockHint() {
    const ws = state.ws;
    const ch = ws.ch;
    const hs = state.progress.hintsSeen[ch.id];
    if (!hs || hs.fails < 3 || (ws.score && ws.score.solved)) return null;
    const have = new Set(ws.diagram.nodes.map((n) => n.type));
    if (hs.missing && hs.missing !== 'none' && !have.has(hs.missing)) {
      const def = CAT.byType[hs.missing];
      return h('div', { class: 'hint', style: 'margin-top:8px' }, 'A block worth adding: ', h('strong', null, def.label), '. ', def.blurb);
    }
    if (hs.missing === 'none' && C.suggestMissingBlock(ws.diagram, ch) === null) {
      return h('p', { class: 'muted' }, 'You already use every kind of block the reference design uses. Look at the connections and settings.');
    }
    return h('div', { class: 'row', style: 'margin-top:8px' }, btn('Show a block you’re missing', () => {
      hs.missing = C.suggestMissingBlock(ws.diagram, ch) || 'none';
      Progress.save();
      renderBriefStatus();
      if ($('#sheet').open && W.inResults) openResults(true);
    }, { cls: 'btn-sm' }));
  }

  /* ---- [APP:PANELS:PROPS] ---- */
  function propField(spec, key, value, onChange, roles) {
    if (spec.kind === 'bool') {
      return h('label', { class: 'field-check' },
        h('input', { type: 'checkbox', checked: !!value, 'data-field': key, onchange: (e) => onChange(e.target.checked) }), spec.label);
    }
    let input;
    if (spec.kind === 'int') {
      input = h('input', {
        type: 'number', min: spec.min, max: spec.max, step: 1, value: String(value), 'data-field': key, inputmode: 'numeric',
        onchange: (e) => {
          let v = parseInt(e.target.value, 10);
          if (!Number.isFinite(v)) v = spec.default;
          onChange(clamp(v, spec.min ?? -Infinity, spec.max ?? Infinity));
        },
      });
    } else if (spec.kind === 'enum') {
      const options = spec.options === 'roles' ? roles : spec.options;
      input = h('select', { 'data-field': key, onchange: (e) => onChange(e.target.value) },
        options.map((o) => h('option', { value: o, selected: o === value }, o)));
    } else {
      input = h('input', { type: 'text', value: value || '', 'data-field': key, onchange: (e) => onChange(e.target.value.trim()) });
    }
    return h('label', { class: 'field' }, h('span', null, spec.label), input);
  }

      fill(W.props, close, body);

  function nodePanel(n) {
    const ws = state.ws;
    const def = CAT.byType[n.type];

      locked ? h('p', { class: 'muted', style: 'margin-top:8px' }, 'Part of the starting design: it can’t be removed, but its settings can change.') : null);
  }

  function edgePanel(e) {
    const ws = state.ws;
    const a = nodeById(e.from);
    const b = nodeById(e.to);
    const kind = CAT.edgeKinds.find((k) => k.kind === e.kind);

  /* ---- [APP:PANELS:RESULTS] ---- */
  function openSheet(title, body, foot, opts) {
    const sheet = $('#sheet');
    sheet.className = 'sheet' + (opts && opts.wide ? ' wide' : '');
    const scroll = opts && opts.keepScroll ? sheet.scrollTop : 0;
    fill(sheet,
      h('div', { class: 'sheet-head' }, h('h2', { id: 'sheetTitle' }, title),
        btn('', closeSheet, { icon: 'close', cls: 'btn-quiet btn-icon', aria: 'Close' })),
      h('div', { class: 'sheet-body' }, body),
      foot && foot.length ? h('div', { class: 'sheet-foot' }, foot) : null);
    if (!sheet.open) sheet.showModal();
    sheet.scrollTop = scroll;
  }
  function closeSheet() {
    const sheet = $('#sheet');
    if (sheet.open) sheet.close();
  }

  function checkDesign() {
    const ws = state.ws;
    const ch = ws.ch;
    closeMenu();
    ws.results = C.validate(ws.diagram, ch);
    ws.score = C.score(ws.results, { budgetOk: C.budgetOk(ws.diagram, ch), quizCorrect: Progress.quizCorrect(ch) });
    ws.checkedSnap = snapshot();
    ws.checkedBudgetOk = C.budgetOk(ws.diagram, ch);
    Progress.record(ch, ws.score);
    renderBrief();
    openResults();
  }

  // Quiz answers can raise the stars of the last check; stars already earned are never lowered.
  function rescore() {
    const ws = state.ws;
    if (!ws.results) return;
    ws.score = C.score(ws.results, { budgetOk: ws.checkedBudgetOk, quizCorrect: Progress.quizCorrect(ws.ch) });
    const prev = Progress.solved(ws.ch.id);
    if (ws.score.solved && prev && ws.score.stars > prev.stars) {
      prev.stars = ws.score.stars;
      prev.bestAt = new Date().toISOString();
    }
    Progress.save();
    renderBrief();
  }

  const fmtNum = (v) => Number(v).toLocaleString(undefined, { maximumFractionDigits: 3 });

  function resultList(list, hs, showHints) {
    return h('ul', { class: 'results' }, list.map((r) => {
      const status = r.pass ? 'pass' : r.severity === 'warn' ? 'warn' : 'fail';
      return h('li', null, icon(status, 'ico-' + status),
        h('div', null,
          h('div', null, h('span', { class: 'sr-only' }, r.pass ? 'Met: ' : 'Not met: '), inline(r.text)),
          h('div', { class: 'detail' }, r.detail),
          (r.severity === 'warn' && !r.pass) || (showHints && !r.pass && hs.fails >= 2) ? (r.hint ? h('div', { class: 'hint' }, inline(r.hint)) : null) : null));
    }));
  }

  function openResults(keepScroll) {
    const ws = state.ws;
    const ch = ws.ch;
    const sc = ws.score;
    const res = ws.results;
    const hs = Progress.hints(ch.id);
    const best = Progress.solved(ch.id);
    const q = Progress.quiz(ch.id);
    const req = res.filter((r) => r.severity === 'required');
    const bonus = res.filter((r) => r.severity === 'bonus');
    const warns = res.filter((r) => r.severity === 'warn' && !r.pass);
    const cost = C.diagramCost(ws.diagram);
    W.inResults = true;

    const verdict = sc.solved
      ? h('div', { class: 'verdict ok' }, icon('pass'), h('div', { style: 'flex:1' },
        h('b', null, 'Solved'),
        h('div', null, `All ${req.length} requirements met${bonus.length ? `; ${sc.bonus.passed} of ${sc.bonus.total} bonus points` : ''}.`)),
      h('span', { class: 'big-stars' }, stars(sc.stars)))
      : h('div', { class: 'verdict no' }, icon('fail'), h('div', null,
        h('b', null, 'Not solved yet'),
        h('div', null, `${sc.required.passed} of ${sc.required.total} requirements met. Adjust the design and check again.`)));
    const starHow = sc.solved && sc.stars < 3
      ? h('p', { class: 'muted', style: 'margin-top:8px' }, bonus.length
        ? 'More stars: meet half the bonus points for the 2nd star, and all of them within budget for the 3rd.'
        : 'More stars: each correct answer below adds one; the 3rd star also needs the design within budget.')
      : null;

    const estimate = (ch.estimate || []).map((item, i) => {
      const ans = q.est[i];
      const unit = item.unit ? ' ' + item.unit : '';
      const wrap = h('div', { class: 'quiz' }, h('b', null, inline(item.q)));
      if (!ans) {
        const input = h('input', { type: 'number', step: 'any', inputmode: 'decimal', 'aria-label': 'Your estimate' });
        wrap.append(h('form', {
          class: 'answer',
          onsubmit: (e) => {
            e.preventDefault();
            if (input.value.trim() === '' || !Number.isFinite(Number(input.value))) { input.focus(); return; }
            q.est[i] = { value: Number(input.value), ok: C.estimateOk(item, Number(input.value)) };
            rescore();
            openResults(true);
          },
        }, input, item.unit ? h('span', null, item.unit) : null, h('button', { type: 'submit', class: 'btn btn-sm' }, 'Submit answer')),
        h('div', { class: 'muted' }, `One try. Within ±${Math.round(item.tolerance * 100)}% counts as correct.`));
      } else {
        wrap.append(h('div', { class: 'feedback ' + (ans.ok ? 'ok' : 'no') },
          ans.ok ? `Correct — you said ${fmtNum(ans.value)}${unit}; the estimate is about ${fmtNum(item.answer)}${unit}.`
            : `Not quite — you said ${fmtNum(ans.value)}${unit}; the estimate is about ${fmtNum(item.answer)}${unit}.`,
          h('p', null, inline(item.workings))));
      }
      return wrap;
    });

    let tradeoff = null;
    if (ch.tradeoff) {
      const t = ch.tradeoff;
      const answered = q.tradeoff !== null && q.tradeoff !== undefined;
      const name = 'tradeoff-' + ch.id;
      const choices = h('div', { class: 'quiz-choices', role: 'radiogroup', 'aria-label': t.q }, t.choices.map((c, i) => h('label', {
        class: answered ? (i === t.correct ? 'is-correct' : i === q.tradeoff ? 'is-wrong' : '') : '',
      }, h('input', { type: 'radio', name, value: String(i), checked: answered && i === q.tradeoff, disabled: answered }), h('span', null, inline(c)))));
      tradeoff = h('div', { class: 'quiz' }, h('b', null, inline(t.q)), answered
        ? [choices, h('div', { class: 'feedback ' + (q.tradeoff === t.correct ? 'ok' : 'no') }, q.tradeoff === t.correct ? 'Correct.' : 'Not quite.', h('p', null, inline(t.why)))]
        : h('form', {
          class: 'quiz',
          onsubmit: (e) => {
            e.preventDefault();
            const picked = choices.querySelector('input:checked');
            if (!picked) return;
            q.tradeoff = Number(picked.value);
            rescore();
            openResults(true);
          },
        }, choices, h('div', null, h('button', { type: 'submit', class: 'btn btn-sm' }, 'Submit answer'))));
    }

    const canSolution = !!best || hs.fails >= 5;
    const next = state.pack.challenges[state.pack.challenges.indexOf(ch) + 1];
    const nextOpen = next && chapterOpen(next.chapter);
    const body = [
      verdict, starHow,
      h('section', null, h('h3', null, 'Requirements'), resultList(req, hs, true)),
      bonus.length ? h('section', null, h('h3', null, 'Bonus'), resultList(bonus, hs, false)) : null,
      warns.length ? h('section', null, h('h3', null, 'Worth a second look'), h('p', { class: 'muted' }, 'These don’t block solving, but they are risky patterns.'), resultList(warns, hs, false)) : null,
      ch.budget ? h('section', null, h('h3', null, 'Budget'), h('div', { class: 'cost-line' + (cost > ch.budget ? ' over' : '') },
        h('span', null, 'Cost of your design'), h('b', null, `${cost} of ${ch.budget}${cost > ch.budget ? ' — over budget' : ''}`))) : null,
      !sc.solved && hs.fails >= 3 ? h('section', null, h('h3', null, 'Stuck?'), missingBlockHint()) : null,
      estimate.length ? h('section', null, h('h3', null, 'Estimate'), estimate) : null,
      tradeoff ? h('section', null, h('h3', null, 'Trade-off'), tradeoff) : null,
      (sc.solved || best) && ch.learn ? h('section', null, h('h3', null, 'Takeaway'), h('div', { class: 'learn' }, renderText(ch.learn))) : null,
    ];
    const foot = [
      btn('Keep editing', closeSheet),
      btn('Show solution', openSolution, { disabled: !canSolution, title: canSolution ? null : 'Available after you solve it, or after 5 checks' }),
      best && next ? btn('Next challenge', () => { closeSheet(); go('#/c/' + encodeURIComponent(next.id)); }, { cls: 'btn-primary', disabled: !nextOpen, title: nextOpen ? null : lockReason(next.chapter) }) : null,
    ];
    openSheet('Design check', body, foot, { keepScroll });
  }

  function renderHome(view) {
    const pack = state.pack;
    document.title = `${pack.title} · Blockprint`;
    const list = pack.challenges;
    const solved = list.filter((c) => Progress.solved(c.id));
    const starSum = solved.reduce((sum, c) => sum + Progress.solved(c.id).stars, 0);
    const openChapters = new Map(pack.chapters.map((c) => [c.id, chapterOpen(c.id)]));
    const nextUp = list.find((c) => openChapters.get(c.chapter) && !Progress.solved(c.id));
    const focusChapter = pack.chapters.find((c) => c.id === state.homeChapter) || (nextUp ? chapterOf(nextUp) : pack.chapters[0]);
    const preview = h('div', { class: 'side-block', 'aria-live': 'polite' });

    const showPreview = (c, open) => {
      const sv = Progress.solved(c.id);
      fill(preview,
        h('h2', null, `${challengeNumber(c.id)}. ${c.title}`),
        h('p', { class: 'muted' }, `Difficulty ${c.difficulty} of 5${c.boss ? ' · chapter finale' : ''} · ${!open ? 'locked' : sv ? `solved, ${sv.stars} of 3 stars` : 'not solved yet'}`),
        open ? h('a', { class: 'btn btn-sm', href: '#/c/' + encodeURIComponent(c.id) }, sv ? 'Open again' : 'Start') : h('p', { class: 'muted' }, lockReason(c.chapter)));
    };
    const defaultPreview = () => {
      if (nextUp) {
        fill(preview, h('h2', null, 'Up next'), h('p', null, `${challengeNumber(nextUp.id)}. ${nextUp.title}`),
          h('a', { class: 'btn btn-primary', href: '#/c/' + encodeURIComponent(nextUp.id) }, solved.length ? 'Continue' : 'Start the first challenge'));
      } else {
        fill(preview, h('h2', null, solved.length === list.length ? 'Every challenge solved' : 'All open challenges solved'),
          h('p', { class: 'muted' }, solved.length === list.length ? 'Go back for missing stars, or load another pack in Settings.' : 'Solve a chapter finale to open the next chapter.'));
      }
    };

    const cell = (c, open) => {
      const num = challengeNumber(c.id);
      const sv = Progress.solved(c.id);
      const cls = `cell${c.boss ? ' is-boss' : ''}${!open ? ' is-locked' : sv ? ' is-solved' : ''}`;
      const hover = { onmouseenter: () => showPreview(c, open), onfocus: () => showPreview(c, open) };
      if (!open) {
        return h('span', Object.assign({
          class: cls, tabindex: 0, role: 'link', 'aria-disabled': 'true', title: `${c.title} (locked)`,
          'aria-label': `Challenge ${num}, ${c.title}, locked`, onclick: () => toast(lockReason(c.chapter)),
        }, hover), h('span', { class: 'n' }, String(num)), h('span', { class: 'stars', 'aria-hidden': 'true' }, ''));
      }
      return h('a', Object.assign({
        class: cls, href: '#/c/' + encodeURIComponent(c.id), title: c.title,
        'aria-label': `Challenge ${num}, ${c.title}, ${sv ? `solved, ${sv.stars} of 3 stars` : 'not solved yet'}${c.boss ? ', chapter finale' : ''}`,
      }, hover), h('span', { class: 'n' }, String(num)),
      h('span', { class: 'stars', 'aria-hidden': 'true' }, sv ? '★'.repeat(sv.stars) + '☆'.repeat(3 - sv.stars) : ''));
    };

    const rows = pack.chapters.map((chap) => {
      const open = openChapters.get(chap.id);
      const inChapter = list.filter((c) => c.chapter === chap.id);
      return h('div', { class: 'plan-row' },
        h('button', {
          type: 'button', class: 'plan-ch' + (open ? '' : ' is-locked'), 'aria-pressed': String(focusChapter === chap),
          onclick: () => { state.homeChapter = chap.id; renderHome(view); },
        }, h('span', { class: 'n' }, String(chap.n).padStart(2, '0')), h('span', null, chap.title)),

    });

    const conceptById = new Map(pack.concepts.map((c) => [c.id, c]));
    const chConcepts = [...new Set(list.filter((c) => c.chapter === focusChapter.id).flatMap((c) => c.concepts))];
    const chList = list.filter((c) => c.chapter === focusChapter.id);
    const chSolved = chList.filter((c) => Progress.solved(c.id)).length;

    fill(view, page(h('div', { class: 'home' },
      h('div', null,
        h('div', { class: 'home-head' }, h('h1', null, pack.title), h('span', { class: 'muted' }, `Version ${pack.version} · ${list.length} ${list.length === 1 ? 'challenge' : 'challenges'}`)),
        h('div', { class: 'plan', 'aria-label': 'Challenges by chapter' }, rows),
        h('div', { class: 'legend', 'aria-hidden': 'true' },
          h('span', null, h('i'), 'Open'), h('span', null, h('i', { class: 'solved' }), 'Solved'),
          h('span', null, h('i', { class: 'locked' }), 'Locked'), h('span', null, '◥ Chapter finale'))),
      h('aside', { class: 'side' },
        h('div', { class: 'side-block' }, h('h2', null, 'Progress'), h('div', { class: 'stat-row' },
          h('div', { class: 'stat' }, h('b', null, `${solved.length}/${list.length}`), h('span', null, 'solved')),
          h('div', { class: 'stat' }, h('b', null, `${starSum}/${list.length * 3}`), h('span', null, 'stars')))),
        preview,
        h('div', { class: 'side-block' },
          h('h2', null, `Chapter ${focusChapter.n}: ${focusChapter.title}`),
          focusChapter.intro ? h('div', null, renderText(focusChapter.intro)) : null,
          h('p', { class: 'muted' }, `${chSolved} of ${chList.length} solved${openChapters.get(focusChapter.id) ? '' : ' · locked'}`),

    view.querySelector('.plan').addEventListener('mouseleave', defaultPreview);

        h('section', { style: 'margin-top:18px' }, h('h2', null, 'Practised in'),
          practiced.length ? h('ul', null, practiced.map((c) => h('li', null, chapterOpen(c.chapter)
            ? h('a', { href: '#/c/' + encodeURIComponent(c.id) }, `${challengeNumber(c.id)}. ${c.title}`)
            : h('span', { class: 'muted' }, `${challengeNumber(c.id)}. ${c.title} (locked)`)))) : h('p', { class: 'muted' }, 'No challenge uses this concept yet.')));
    }
    fill(view, page(h('div', { class: 'gloss' }, listEl, detail)));
  }

  function renderSettings(view) {
    document.title = 'Settings · Blockprint';
    const st = state.settings;
    const pack = state.pack;
    const seg = (name, options, value, onPick) => h('div', { class: 'seg', role: 'radiogroup', 'aria-label': name },
      options.map(([v, label]) => h('label', null, h('input', { type: 'radio', name, value: v, checked: v === value, onchange: () => onPick(v) }), label)));
    const selftestHref = location.pathname + '?selftest' + location.hash;
    fill(view, h('div', { class: 'page page-narrow settings' },
      h('h1', { style: 'margin-bottom:10px' }, 'Settings'),
      h('section', null, h('h2', null, 'Challenge pack'),
        pack ? h('dl', { class: 'kv' },
          h('dt', null, 'Title'), h('dd', null, pack.title),
          h('dt', null, 'Version'), h('dd', null, pack.version),
          h('dt', null, 'Challenges'), h('dd', null, String(pack.challenges.length)),
          h('dt', null, 'Loaded from'), h('dd', null, state.packSource)) : h('p', null, 'No pack is loaded.'),
        errorList(state.loadErrors, state.loadErrorSource),
        h('div', { class: 'row', style: 'margin-top:12px' }, filePickerButton('Load another pack'),
          pack ? h('a', { class: 'btn btn-quiet', href: selftestHref }, 'Run pack self-test') : null)),
      h('section', null, h('h2', null, 'Appearance'),
        seg('Theme', [['system', 'System'], ['light', 'Light'], ['dark', 'Dark']], st.theme, (v) => { st.theme = v; Settings.save(); })),
      h('section', null, h('h2', null, 'Editor'),
        h('p', { class: 'muted' }, 'List mode edits the same design as rows instead of a canvas; it works with a keyboard or screen reader. Auto uses list mode on small screens.'),
        seg('Editor', [['auto', 'Auto'], ['canvas', 'Canvas'], ['list', 'List']], st.editorMode, (v) => { st.editorMode = v; Settings.save(); })),
      pack ? h('section', null, h('h2', null, 'Progress'),
        h('label', { class: 'field-check' }, h('input', {
          type: 'checkbox', checked: st.openAll, onchange: (e) => { st.openAll = e.target.checked; Settings.save(); },
        }), 'Open all challenges (skip chapter unlocking)'),
        h('div', { class: 'row', style: 'margin-top:10px' },
          btn('Export progress', exportProgress),
          btn('Import progress', () => pickFile('.json,application/json', importProgress)),
          btn('Reset progress for this pack', resetProgress, { cls: 'btn-danger' }))) : null));
  }

  function renderNotFound(view) {
    document.title = 'Not found · Blockprint';
    fill(view, page(h('h1', null, 'There’s nothing here'), h('p', { style: 'margin-top:10px' }, 'The address doesn’t match any page.'), h('a', { class: 'btn', href: '#/' }, 'Back to challenges')));
  }

  /* ==== [APP:EXPORT] ==== */
  function exportDesign() {
    const ws = state.ws;
    download(`${ws.cid}-design.json`, JSON.stringify({ format: 'blockprint-diagram', schema: 1, packId: state.pack.id, challengeId: ws.cid, diagram: ws.diagram }, null, 2), 'application/json');
  }

  function importDesign() {
    const ws = state.ws;
    pickFile('.json,application/json', async (file) => {
      let obj;
      try { obj = JSON.parse(await file.text()); } catch (e) { toast('That file isn’t valid JSON.'); return; }
      if (!obj || obj.format !== 'blockprint-diagram') { toast('That file isn’t a Blockprint design export.'); return; }
      const d = sanitizeDiagram(obj.diagram, ws.ch);
      if (!d) { toast('That design file is empty or damaged.'); return; }
      if (obj.challengeId !== ws.cid && !confirm('This design was made for another challenge. Load it anyway?')) return;
      change(() => { state.ws.diagram = d; });
      if (ws.mode === 'canvas') fitView();
      toast('Design imported. Undo brings back the previous one.');
    });
  }

  function startOver() {
    const ws = state.ws;
    const what = ws.ch.start ? 'the starting design' : 'an empty canvas';
    if (!confirm(`Replace your design with ${what}? You can undo this.`)) return;
    change(() => { state.ws.diagram = initialDiagram(ws.ch); });
    ws.sel = null;
    renderProps();
    if (ws.mode === 'canvas') fitView();
  }

  // Standalone SVG: the editor's own rules plus the current theme's resolved colors.
  function exportMarkup() {
    const ws = state.ws;
    if (!ws.diagram.nodes.length && !ws.diagram.groups.length) { toast('Nothing to export yet. Add some blocks first.'); return null; }
    const { svg, bounds, pad } = staticSvg(ws.diagram, 'x');
    const w = Math.ceil(bounds.w + 2 * pad);
    const hgt = Math.ceil(bounds.h + 2 * pad);
    const cs = getComputedStyle(document.documentElement);
    const names = ['--paper', '--surface', '--ink', '--ink-2', '--ink-3', '--node-bg', '--node-line', '--edge', '--group-line', '--group-fill',
      '--group-public', '--group-private', '--select', '--font-cond', '--font-ui', '--cat-group', ...CAT.categories.map((c) => '--cat-' + c.id)];
    const vars = names.map((n) => `${n}:${cs.getPropertyValue(n).trim()};`).join('');
    const rules = [];
    for (const sheet of document.styleSheets) {
      let list;
      try { list = sheet.cssRules; } catch (e) { continue; }
      for (const rule of list) {
        if (rule.selectorText && /(^|[\s,])\.(node|edge|group|marker|cat-|glyph)/.test(rule.selectorText)) rules.push(rule.cssText);
      }
    }
    svg.setAttribute('width', w);
    svg.setAttribute('height', hgt);
    svg.insertBefore(s('style', null, `svg{${vars}font-family:var(--font-ui);} .bg{fill:var(--paper);} ${rules.join(' ')}`), svg.firstChild);
    svg.insertBefore(s('rect', { class: 'bg', x: bounds.x - pad, y: bounds.y - pad, width: w, height: hgt }), svg.children[2]);
    return { text: '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(svg), w, h: hgt };
  }
  function exportSVG() {
    const out = exportMarkup();
    if (out) download(`${state.ws.cid}.svg`, out.text, 'image/svg+xml');
  }
  function exportPNG() {
    const out = exportMarkup();
    if (!out) return;
    const cid = state.ws.cid;
    const url = URL.createObjectURL(new Blob([out.text], { type: 'image/svg+xml;charset=utf-8' }));
    const img = new Image();
    img.onload = () => {
      const scale = 2;
      const canvas = document.createElement('canvas');
      canvas.width = out.w * scale;
      canvas.height = out.h * scale;
      const ctx = canvas.getContext('2d');
      ctx.scale(scale, scale);
      ctx.drawImage(img, 0, 0, out.w, out.h);
      URL.revokeObjectURL(url);
      canvas.toBlob((b) => (b ? download(`${cid}.png`, b) : toast('PNG export failed in this browser. Try SVG instead.')), 'image/png');
    };
    img.onerror = () => { URL.revokeObjectURL(url); toast('PNG export failed in this browser. Try SVG instead.'); };
    img.src = url;
  }

  function exportProgress() {
    const pack = state.pack;
    const prefix = `draft.${pack.id}.`;
    const drafts = {};
    for (const key of Store.keys(prefix)) {
      const v = Store.get(key);
      if (v && v.diagram) drafts[key.slice(prefix.length)] = v.diagram;
    }
    download(`blockprint-progress-${pack.id}.json`, JSON.stringify({
      format: 'blockprint-progress', schema: 1, packId: pack.id, packVersion: pack.version,
      exportedAt: new Date().toISOString(), progress: state.progress, drafts,
    }, null, 2), 'application/json');
  }

  async function importProgress(file) {
    const pack = state.pack;
    let obj;
    try { obj = JSON.parse(await file.text()); } catch (e) { toast('That file isn’t valid JSON.'); return; }
    if (!obj || obj.format !== 'blockprint-progress' || !obj.progress || typeof obj.progress.solved !== 'object') {
      toast('That file isn’t a Blockprint progress export.');
      return;
    }
    if (obj.packId !== pack.id) { toast(`That progress file is for the pack “${obj.packId}”, not “${pack.id}”.`, 5000); return; }
    if (!confirm('Replace your progress and saved designs for this pack with the ones in this file?')) return;
    Store.set('progress.' + pack.id, obj.progress);
    state.progress = Progress.load(pack);
    Progress.save();
    for (const [cid, diagram] of Object.entries(obj.drafts || {})) {
      const ch = pack.challenges.find((c) => c.id === cid);
      const d = ch && sanitizeDiagram(diagram, ch);
      if (d) Store.set(`draft.${pack.id}.${cid}`, { diagram: d, at: new Date().toISOString() });
    }
    toast('Progress imported.');
    render();
  }

  function resetProgress() {
    const pack = state.pack;
    if (!confirm(`Reset all progress for “${pack.title}”? Stars, hints and saved designs for this pack will be deleted. This can’t be undone.`)) return;
    Store.remove('progress.' + pack.id);
    Store.keys(`draft.${pack.id}.`).forEach((k) => Store.remove(k));
    state.progress = Progress.load(pack);
    toast('Progress reset.');
    render();
  }

  /* ==== [APP:SELFTEST] ==== */
  function showSelfTest() {
    if (!state.pack) {
      openSheet('Pack self-test', [h('p', null, 'No pack is loaded, so there is nothing to test.'), errorList(state.loadErrors, state.loadErrorSource)], [btn('Close', closeSheet)]);
      return;
    }
    const parsed = C.parsePack(state.packText);
    const report = C.runPackSelfTest(state.pack);
    const passed = report.challenges.filter((c) => c.ok).length;
    const rows = [];
    for (const c of report.challenges) {
      c.checks.forEach((k, i) => rows.push(h('tr', { class: k.pass ? '' : 'is-fail' },
        h('td', null, i === 0 ? `${c.id}` : ''), h('td', null, i === 0 ? c.title : ''),
        h('td', null, k.name), h('td', null, k.pass ? '✓ pass' : '✕ fail'), h('td', { class: 'muted' }, k.detail))));
    }
    console.info('[Blockprint] self-test', { schemaErrors: parsed.errors, warnings: parsed.warnings, report });
    openSheet('Pack self-test', [
      h('div', { class: 'verdict ' + (parsed.errors.length || !report.ok ? 'no' : 'ok') }, icon(parsed.errors.length || !report.ok ? 'fail' : 'pass'),
        h('div', null, h('b', null, `${state.pack.title} v${state.pack.version}`),
          h('div', null, `Schema: ${parsed.errors.length ? parsed.errors.length + ' errors' : 'valid'}, ${parsed.warnings.length} warnings. Expected results: ${passed} of ${report.challenges.length} challenges pass.`))),
      parsed.errors.length ? errorList(parsed.errors, 'The pack') : null,
      parsed.warnings.length ? h('section', null, h('h3', null, 'Warnings'), h('ul', null, parsed.warnings.map((w) => h('li', null, h('code', null, w.path), ': ', w.message)))) : null,
      h('section', null, h('table', { class: 'selftest-table' },
        h('thead', null, h('tr', null, h('th', null, 'Id'), h('th', null, 'Challenge'), h('th', null, 'Check'), h('th', null, 'Result'), h('th', null, 'Detail'))),
        h('tbody', null, rows))),
    ], [btn('Close', closeSheet, { cls: 'btn-primary' })], { wide: true });
  }

  /* ==== [APP:BOOT] ==== */
  function wireGlobalEvents() {
    document.addEventListener('keydown', onKeyDown);
    const sheet = $('#sheet');
    sheet.addEventListener('click', (ev) => { if (ev.target === sheet) closeSheet(); });
    sheet.addEventListener('close', () => { if (W) W.inResults = false; });

    // Dropping a file anywhere loads it as a pack. Palette drags carry no files and are ignored.
    const hint = $('#dropHint');
    const hasFiles = (ev) => ev.dataTransfer && [...ev.dataTransfer.types].includes('Files');
    let depth = 0;
    window.addEventListener('dragenter', (ev) => { if (hasFiles(ev)) { depth++; hint.hidden = false; } });
    window.addEventListener('dragleave', (ev) => { if (hasFiles(ev)) { depth = Math.max(0, depth - 1); if (!depth) hint.hidden = true; } });
    window.addEventListener('dragover', (ev) => { if (hasFiles(ev)) ev.preventDefault(); });
    window.addEventListener('drop', (ev) => {
      if (!hasFiles(ev)) return;
      ev.preventDefault();
      depth = 0;
      hint.hidden = true;
      const f = ev.dataTransfer.files[0];
      if (f) Loader.fromFile(f);
    });
    window.addEventListener('pagehide', flushSave);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); });
  }

  async function boot() {
    Settings.load();
    updateChrome();
    wireGlobalEvents();
    const params = new URLSearchParams(location.search);
    fill($('#view'), h('div', { class: 'page muted' }, 'Loading challenges…'));
    await Loader.start(params);
    updateChrome();
    render();
    window.addEventListener('hashchange', render);
    if (params.has('selftest')) showSelfTest();
  }

  boot();
})();
  </script>
