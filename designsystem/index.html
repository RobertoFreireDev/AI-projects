<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Blockprint</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f3a5f'/%3E%3Cpath d='M7 8h8v6H7zM17 18h8v6h-8zM11 14v7h6' fill='none' stroke='%23e6ece6' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    /* ==== [CSS:TOKENS] ==== */
    :root {
      --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-cond: "Avenir Next Condensed", "Arial Narrow", "Roboto Condensed", sans-serif-condensed, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

      --paper: #e4ebe5;
      --paper-grid: rgba(31, 58, 95, 0.09);
      --paper-grid-major: rgba(31, 58, 95, 0.18);
      --surface: #f3f6f2;
      --surface-2: #e9eee8;
      --surface-3: #dde5de;
      --line: #c3cec5;
      --line-strong: #93a39a;
      --ink: #1f3a5f;
      --ink-2: #3f5775;
      --ink-3: #6b7d92;
      --on-ink: #eef3ee;
      --focus: #2a66b5;
      --select: #2a66b5;
      --pass: #2e6f47;
      --pass-bg: #dcebdf;
      --fail: #9b3328;
      --fail-bg: #f3dfdb;
      --warn: #85600f;
      --warn-bg: #f1e7cf;
      --node-bg: #fbfcfa;
      --node-line: #8c9c93;
      --edge: #2a4466;
      --group-line: #5d7390;
      --group-fill: rgba(31, 58, 95, 0.035);
      --group-public: rgba(160, 110, 30, 0.07);
      --group-private: rgba(40, 110, 80, 0.07);
      --shadow: 0 1px 2px rgba(20, 35, 55, 0.12), 0 6px 20px rgba(20, 35, 55, 0.12);
      --hatch: rgba(31, 58, 95, 0.12);

      --cat-client: #52679a;
      --cat-traffic: #2f7469;
      --cat-compute: #65539a;
      --cat-data: #8d5f22;
      --cat-messaging: #8e4459;
      --cat-coordination: #56702f;
      --cat-security: #8a4431;
      --cat-observability: #336785;
      --cat-external: #626262;
      --cat-group: #5d7390;

      --bar-bg: #1f3a5f;
      --bar-fg: #eef3ee;

      --r-sm: 4px;
      --r-md: 6px;
      --gap: 12px;
      --bar-h: 52px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #1c2329;
        --paper-grid: rgba(214, 225, 232, 0.06);
        --paper-grid-major: rgba(214, 225, 232, 0.13);
        --surface: #222a31;
        --surface-2: #29323a;
        --surface-3: #313b44;
        --line: #3a4652;
        --line-strong: #5a6875;
        --ink: #d7e2e9;
        --ink-2: #b4c2cc;
        --ink-3: #8595a2;
        --on-ink: #1c2329;
        --focus: #7fb0ea;
        --select: #7fb0ea;
        --pass: #7cc294;
        --pass-bg: #213a2b;
        --fail: #ec8d80;
        --fail-bg: #43251f;
        --warn: #e0bb66;
        --warn-bg: #3d321a;
        --node-bg: #262f37;
        --node-line: #56646f;
        --edge: #c9d6df;
        --group-line: #8fa3b5;
        --group-fill: rgba(214, 225, 232, 0.03);
        --group-public: rgba(224, 187, 102, 0.06);
        --group-private: rgba(124, 194, 148, 0.06);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
        --hatch: rgba(214, 225, 232, 0.08);

        --cat-client: #9dafdb;
        --cat-traffic: #82c1b6;
        --cat-compute: #b3a3de;
        --cat-data: #d8ab6f;
        --cat-messaging: #d993a7;
        --cat-coordination: #a8c486;
        --cat-security: #d59b86;
        --cat-observability: #8bb9d8;
        --cat-external: #b5b5b5;
        --cat-group: #8fa3b5;
        --bar-bg: #141a1f;
        --bar-fg: #d7e2e9;
      }
    }
    :root[data-theme="dark"] {
      --paper: #1c2329;
      --paper-grid: rgba(214, 225, 232, 0.06);
      --paper-grid-major: rgba(214, 225, 232, 0.13);
      --surface: #222a31;
      --surface-2: #29323a;
      --surface-3: #313b44;
      --line: #3a4652;
      --line-strong: #5a6875;
      --ink: #d7e2e9;
      --ink-2: #b4c2cc;
      --ink-3: #8595a2;
      --on-ink: #1c2329;
      --focus: #7fb0ea;
      --select: #7fb0ea;
      --pass: #7cc294;
      --pass-bg: #213a2b;
      --fail: #ec8d80;
      --fail-bg: #43251f;
      --warn: #e0bb66;
      --warn-bg: #3d321a;
      --node-bg: #262f37;
      --node-line: #56646f;
      --edge: #c9d6df;
      --group-line: #8fa3b5;
      --group-fill: rgba(214, 225, 232, 0.03);
      --group-public: rgba(224, 187, 102, 0.06);
      --group-private: rgba(124, 194, 148, 0.06);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
      --hatch: rgba(214, 225, 232, 0.08);

      --cat-client: #9dafdb;
      --cat-traffic: #82c1b6;
      --cat-compute: #b3a3de;
      --cat-data: #d8ab6f;
      --cat-messaging: #d993a7;
      --cat-coordination: #a8c486;
      --cat-security: #d59b86;
      --cat-observability: #8bb9d8;
      --cat-external: #b5b5b5;
      --cat-group: #8fa3b5;
      --bar-bg: #141a1f;
      --bar-fg: #d7e2e9;
      color-scheme: dark;
    }
    :root[data-theme="light"] { color-scheme: light; }

    /* ==== [CSS:LAYOUT] ==== */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--surface);
      color: var(--ink);
      font: 15px/1.5 var(--font-ui);
      -webkit-font-smoothing: antialiased;
    }
    [hidden] { display: none !important; }
    a { color: var(--focus); }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    h1, h2, h3, h4 { margin: 0; line-height: 1.25; font-weight: 650; }
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1.15rem; }
    h3 { font-size: 1rem; }
    p { margin: 0 0 0.6em; }
    .muted { color: var(--ink-3); }
    .mono { font-family: var(--font-mono); font-size: 0.86em; }
    .cond { font-family: var(--font-cond); font-stretch: condensed; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .app { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; height: 100dvh; }
    .topbar {
      display: flex; align-items: center; gap: 20px;
      padding: 0 16px; height: 48px;
      background: var(--bar-bg); color: var(--bar-fg);
    }
    .brand { display: flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; font-weight: 700; letter-spacing: 0.01em; }
    .brand svg { width: 22px; height: 22px; }
    .topnav { display: flex; gap: 2px; }
    .topnav a {
      color: inherit; text-decoration: none; opacity: 0.78;
      padding: 6px 10px; border-radius: var(--r-sm);
    }
    .topnav a:hover { opacity: 1; background: rgba(255, 255, 255, 0.08); }
    .topnav a[aria-current="page"] { opacity: 1; box-shadow: inset 0 -2px 0 currentColor; border-radius: 0; }
    .topbar .pack-name { margin-left: auto; font-size: 0.85rem; opacity: 0.75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .notice {
      padding: 6px 16px; font-size: 0.85rem;
      background: var(--warn-bg); color: var(--warn); border-bottom: 1px solid var(--line);
    }
    /* Explicit row: the notice above is often hidden and must not shift main into an auto row. */
    .view { grid-row: 3; min-height: 0; overflow: auto; position: relative; }
    .view:focus { outline: none; }
    .page { max-width: 1180px; margin: 0 auto; padding: 28px 20px 48px; }
    .page-narrow { max-width: 760px; }

    /* Home */
    .home { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; align-items: start; }
    .home-head { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .home-head .muted { font-size: 0.9rem; }
    .plan {
      padding: 20px; border: 1px solid var(--line-strong); background: var(--paper);
      background-image:
        linear-gradient(var(--paper-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-grid) 1px, transparent 1px);
      background-size: 16px 16px;
    }
    .plan-row { display: grid; grid-template-columns: 172px minmax(0, 1fr); gap: 12px; align-items: center; padding: 6px 0; }
    .plan-row + .plan-row { border-top: 1px dashed var(--line); }
    .plan-ch {
      display: flex; gap: 8px; align-items: baseline; text-align: left;
      background: none; border: 0; padding: 4px 6px; margin: 0; color: var(--ink); cursor: pointer;
      font: 600 0.95rem/1.2 var(--font-cond); font-stretch: condensed; border-radius: var(--r-sm);
    }
    .plan-ch:hover, .plan-ch[aria-pressed="true"] { background: var(--surface-3); }
    .plan-ch .n { color: var(--ink-3); min-width: 1.6em; }
    .plan-ch.is-locked { color: var(--ink-3); }
    .plan-cells { display: flex; flex-wrap: wrap; gap: 6px; }
    .cell {
      position: relative; width: 58px; height: 58px; flex: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
      border: 1.5px solid var(--ink); background: var(--node-bg); color: var(--ink);
      text-decoration: none; font-family: var(--font-cond); font-stretch: condensed;
      transition: background-color 0.15s;
    }
    .cell .n { font-size: 1.15rem; font-weight: 650; line-height: 1; }
    .cell .stars { font-size: 0.72rem; letter-spacing: 1px; line-height: 1; color: var(--ink-3); }
    .cell:hover { background: var(--surface-3); }
    .cell.is-boss { outline: 1.5px solid var(--ink); outline-offset: 2px; }
    .cell.is-boss::after {
      content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px;
      background: currentColor; clip-path: polygon(0 0, 100% 0, 100% 100%);
    }
    .cell.is-solved { background: var(--ink); color: var(--on-ink); }
    .cell.is-solved .stars { color: var(--on-ink); }
    .cell.is-solved:hover { background: var(--ink-2); }
    .cell.is-locked {
      border-color: var(--line-strong); color: var(--ink-3); cursor: not-allowed;
      background: repeating-linear-gradient(45deg, transparent 0 5px, var(--hatch) 5px 6px), var(--surface-2);
    }
    .cell.is-locked:hover { background: repeating-linear-gradient(45deg, transparent 0 5px, var(--hatch) 5px 6px), var(--surface-2); }
    .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; font-size: 0.82rem; color: var(--ink-3); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { display: inline-block; width: 14px; height: 14px; border: 1.5px solid var(--ink); background: var(--node-bg); }
    .legend i.solved { background: var(--ink); }
    .legend i.locked { border-color: var(--line-strong); background: repeating-linear-gradient(45deg, transparent 0 3px, var(--hatch) 3px 4px), var(--surface-2); }
    .side { display: flex; flex-direction: column; gap: 16px; }
    .side-block { border-top: 2px solid var(--ink); padding-top: 10px; }
    .side-block h2 { font-size: 1rem; margin-bottom: 6px; }
    .stat-row { display: flex; gap: 20px; }
    .stat b { display: block; font: 650 1.6rem/1.1 var(--font-cond); font-stretch: condensed; }
    .stat span { font-size: 0.8rem; color: var(--ink-3); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
      border: 1px solid var(--line-strong); border-radius: 999px; font-size: 0.8rem; color: var(--ink-2);
      text-decoration: none; background: var(--surface);
    }
    a.chip:hover { border-color: var(--ink); color: var(--ink); }

    /* Workspace */
    .ws {
      height: 100%; display: grid;
      grid-template-columns: 320px minmax(0, 1fr) 290px;
      grid-template-rows: minmax(0, 1fr) auto;
      grid-template-areas: "brief stage props" "bar bar bar";
    }
    .ws-brief { grid-area: brief; border-right: 1px solid var(--line); }
    .ws-props { grid-area: props; border-left: 1px solid var(--line); }
    /* position: relative keeps absolutely positioned screen-reader text inside the scrolling panel. */
    .ws-brief, .ws-props { position: relative; background: var(--surface); overflow: auto; padding: 16px; min-height: 0; }
    .ws-stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; background: var(--paper); overflow: hidden; }
    .ws-stage.is-list { overflow: auto; background: var(--surface-2); }
    .ws-bar {
      grid-area: bar; display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; border-top: 1px solid var(--line-strong); background: var(--surface);
      min-width: 0;
    }
    .btn.drawer-toggle, .btn.drawer-close { display: none; }
    .scrim { display: none; }

    @media (max-width: 1100px) {
      .ws { grid-template-columns: 280px minmax(0, 1fr) 260px; }
      .home { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 900px) {
      .ws { grid-template-columns: minmax(0, 1fr); grid-template-areas: "stage" "bar"; }
      .ws-brief, .ws-props {
        grid-area: auto; /* an undefined area name would add implicit tracks */
        position: fixed; top: 48px; bottom: 0; z-index: 30; width: min(360px, 88vw);
        box-shadow: var(--shadow); transition: transform 0.2s ease;
      }
      .ws-brief { left: 0; transform: translateX(-105%); }
      .ws-props { right: 0; transform: translateX(105%); }
      .ws[data-drawer="brief"] .ws-brief, .ws[data-drawer="props"] .ws-props { transform: none; }
      .ws[data-drawer] .scrim { display: block; position: fixed; inset: 48px 0 0; background: rgba(0, 0, 0, 0.25); z-index: 29; }
      .btn.drawer-toggle, .btn.drawer-close { display: inline-flex; }
      .btn.drawer-close { float: right; }
      .topbar { gap: 10px; }
      .topbar .pack-name { display: none; }
    }
    @media (max-width: 600px) {
      .page { padding: 18px 12px 40px; }
      .plan { padding: 12px 10px; }
      .plan-row { grid-template-columns: 1fr; gap: 4px; }
      .cell { width: 46px; height: 46px; }
      .cell .n { font-size: 1rem; }
      .brand span { display: none; }
    }

    /* ==== [CSS:EDITOR] ==== */
    .canvas { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
    .canvas:focus { outline: none; }
    .canvas:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
    .canvas.is-panning { cursor: grabbing; }
    .canvas.is-connecting { cursor: crosshair; }
    .grid-minor { stroke: var(--paper-grid); stroke-width: 1; fill: none; }
    .grid-major { stroke: var(--paper-grid-major); stroke-width: 1; fill: none; }

    .node { cursor: pointer; }
    .node:focus { outline: none; }
    .node .box { fill: var(--node-bg); stroke: var(--node-line); stroke-width: 1.2; }
    .node .stripe { fill: var(--cat); }
    .node .glyph { fill: none; stroke: var(--cat); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .node .label { fill: var(--ink); font: 600 14px var(--font-cond); font-stretch: condensed; }
    .node .sub { fill: var(--ink-3); font: 11.5px var(--font-cond); font-stretch: condensed; }
    .node .lock { fill: none; stroke: var(--ink-3); stroke-width: 1.3; }
    .node.is-sel .box, .node:focus-visible .box { stroke: var(--select); stroke-width: 2.2; }
    .node.is-target .box { stroke: var(--select); stroke-dasharray: 4 3; stroke-width: 2; }
    .port { fill: var(--node-bg); stroke: var(--select); stroke-width: 1.5; opacity: 0; cursor: crosshair; }
    .node:hover .port, .node.is-sel .port { opacity: 1; }
    .canvas.is-dragging .port { opacity: 0; }
    .cat-client { --cat: var(--cat-client); }
    .cat-traffic { --cat: var(--cat-traffic); }
    .cat-compute { --cat: var(--cat-compute); }
    .cat-data { --cat: var(--cat-data); }
    .cat-messaging { --cat: var(--cat-messaging); }
    .cat-coordination { --cat: var(--cat-coordination); }
    .cat-security { --cat: var(--cat-security); }
    .cat-observability { --cat: var(--cat-observability); }
    .cat-external { --cat: var(--cat-external); }
    .cat-group { --cat: var(--cat-group); }

    .edge { cursor: pointer; }
    .edge .line { fill: none; stroke: var(--edge); stroke-width: 1.6; stroke-linejoin: round; }
    .edge.k-async .line { stroke-dasharray: 7 5; }
    .edge.k-replication .line { stroke-dasharray: 0.5 5; stroke-linecap: round; stroke-width: 2.4; }
    .edge.k-data .line { stroke-width: 3.4; }
    .edge .hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; }
    .edge.is-sel .line { stroke: var(--select); }
    .edge:focus { outline: none; }
    .edge:focus-visible .line { stroke: var(--select); }
    .edge-badge { fill: var(--surface); stroke: var(--edge); stroke-width: 1; }
    .edge-badge-text { fill: var(--edge); font: 600 10px var(--font-cond); }
    .marker-fill { fill: var(--edge); }
    .marker-open { fill: none; stroke: var(--edge); stroke-width: 1.5; stroke-linejoin: round; }
    .marker-sel .marker-fill { fill: var(--select); }
    .marker-sel .marker-open { stroke: var(--select); }
    .preview { fill: none; stroke: var(--select); stroke-width: 1.6; stroke-dasharray: 5 4; pointer-events: none; }

    .group .frame { fill: var(--group-fill); stroke: var(--group-line); stroke-width: 1.4; }
    .group.t-region .frame { stroke-dasharray: 12 6; stroke-width: 1.8; }
    .group.t-availability-zone .frame { stroke-dasharray: 5 4; }
    .group.t-vpc .frame { stroke-width: 1.6; }
    .group.t-subnet-public .frame { fill: var(--group-public); stroke-dasharray: 2 3; }
    .group.t-subnet-private .frame { fill: var(--group-private); stroke-dasharray: 2 3; }
    .group .frame-hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: move; }
    .group .tab { fill: var(--surface); stroke: var(--group-line); stroke-width: 1; cursor: move; }
    .group .tab-text { fill: var(--ink-2); font: 600 12px var(--font-cond); font-stretch: condensed; pointer-events: none; }
    .group.is-sel .frame, .group.is-sel .tab { stroke: var(--select); }
    .group .handle { fill: var(--surface); stroke: var(--select); stroke-width: 1.5; }
    .group .handle.nwse { cursor: nwse-resize; }
    .group .handle.nesw { cursor: nesw-resize; }
    .group:not(.is-sel) .handle { display: none; }
    .group:focus { outline: none; }
    .group:focus-visible .frame { stroke: var(--select); stroke-width: 2.2; }

    .stage-hud {
      position: absolute; left: 12px; bottom: 12px; display: flex; gap: 8px; align-items: center;
      font-size: 0.78rem; color: var(--ink-3); pointer-events: none;
    }
    .stage-hud .pill { background: var(--surface); border: 1px solid var(--line); padding: 2px 8px; border-radius: 999px; }
    .stage-empty {
      position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
      color: var(--ink-3); text-align: center; padding: 24px;
    }
    .stage-empty p { max-width: 340px; }
    .connect-banner {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: var(--on-ink); padding: 6px 12px; border-radius: 999px; font-size: 0.85rem;
    }

    /* Palette */
    .palette { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .palette input[type="search"] { width: 150px; flex: none; }
    .palette select.pal-cats { flex: none; width: auto; max-width: 160px; }
    .pal-items { display: flex; gap: 6px; overflow-x: auto; flex: 1; min-width: 120px; padding: 2px; scrollbar-width: thin; }
    .pal-item {
      display: inline-flex; align-items: center; gap: 6px; flex: none;
      padding: 5px 10px 5px 6px; border: 1px solid var(--line-strong); border-left: 4px solid var(--cat);
      border-radius: var(--r-sm); background: var(--node-bg); color: var(--ink);
      font: 600 0.84rem/1.1 var(--font-cond); font-stretch: condensed; cursor: grab; white-space: nowrap;
    }
    .pal-item:hover { border-color: var(--ink); border-left-color: var(--cat); }
    .pal-item svg { width: 18px; height: 18px; flex: none; }
    .pal-item.is-group { border-style: dashed; border-left-style: solid; }
    .glyph-svg { fill: none; stroke: var(--cat); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .bar-actions { display: flex; gap: 6px; align-items: center; flex: none; }
    .bar-sep { width: 1px; height: 24px; background: var(--line); }
    /* Below 900 px the palette gets its own row; on phones the actions wrap and Check spans the width. */
    @media (max-width: 900px) {
      .ws-bar { flex-wrap: wrap; }
      .palette { flex: 1 1 100%; }
      .bar-actions { flex: 1 1 100%; justify-content: flex-end; }
    }
    @media (max-width: 600px) {
      .ws-bar { padding: 8px; gap: 8px; }
      .palette { flex-wrap: wrap; }

    const col = before.length - before.lastIndexOf('\n');

      const bosses = new Map();
      pack.challenges.forEach((ch, i) => {
        checkChallenge(ch, at('challenges', i), ctx, { chapterIds, conceptIds, seen, bosses });
        if (isObj(ch)) {
          usedChapters.add(ch.chapter);
          (Array.isArray(ch.concepts) ? ch.concepts : []).forEach((c) => usedConcepts.add(c));
        }
      });
    }
    (pack.concepts || []).forEach((c, i) => {
      if (isObj(c) && isText(c.id) && !usedConcepts.has(c.id)) ctx.warn(at('concepts', i), `concept "${c.id}" is not used by any challenge`);
    });
    (pack.chapters || []).forEach((c, i) => {
      if (isObj(c) && isText(c.id) && !usedChapters.has(c.id)) ctx.warn(at('chapters', i), `chapter "${c.id}" has no challenges`);
    });
    return done();
  }

  const CHALLENGE_KEYS = ['id', 'chapter', 'title', 'difficulty', 'boss', 'concepts', 'brief', 'functional',
    'nonFunctional', 'numbers', 'palette', 'roles', 'start', 'locked', 'budget', 'estimate', 'tradeoff', 'learn', 'expected'];

  function checkStringArray(v, path, ctx) {
    if (v === undefined) return;
    if (!Array.isArray(v)) { ctx.err(path, 'must be an array of strings'); return; }
    v.forEach((s, i) => { if (!isText(s)) ctx.err(at(path, i), 'must be a non-empty string'); });
  }

  function checkChallenge(ch, path, ctx, env) {
    if (!isObj(ch)) { ctx.err(path, 'must be an object'); return; }
    unknownKeys(ch, CHALLENGE_KEYS, path, ctx);
    if (!isText(ch.id)) ctx.err(at(path, 'id'), 'must be a non-empty string');
    else if (env.seen.has(ch.id)) ctx.err(at(path, 'id'), `duplicate challenge id "${ch.id}"`);
    else env.seen.add(ch.id);
    if (!env.chapterIds.has(ch.chapter)) ctx.err(at(path, 'chapter'), `unknown chapter "${ch.chapter}"`);
    if (!isText(ch.title)) ctx.err(at(path, 'title'), 'must be a non-empty string');
    if (!isInt(ch.difficulty) || ch.difficulty < 1 || ch.difficulty > 5) ctx.err(at(path, 'difficulty'), 'must be a whole number from 1 to 5');
    if (ch.boss !== undefined && typeof ch.boss !== 'boolean') ctx.err(at(path, 'boss'), 'must be true or false');
    if (ch.boss === true) {
      if (env.bosses.has(ch.chapter)) ctx.err(at(path, 'boss'), `chapter "${ch.chapter}" already has a boss (${env.bosses.get(ch.chapter)})`);
      else env.bosses.set(ch.chapter, ch.id);
    }
    if (ch.concepts !== undefined) {
      if (!Array.isArray(ch.concepts)) ctx.err(at(path, 'concepts'), 'must be an array of concept ids');
      else ch.concepts.forEach((c, i) => {
        if (!env.conceptIds.has(c)) ctx.err(at(at(path, 'concepts'), i), `unknown concept "${c}" — add it to the pack's concepts`);
      });
    }
    if (!isText(ch.brief)) ctx.err(at(path, 'brief'), 'must be a non-empty string');
    checkStringArray(ch.functional, at(path, 'functional'), ctx);
    checkStringArray(ch.nonFunctional, at(path, 'nonFunctional'), ctx);
    if (ch.learn !== undefined && !isStr(ch.learn)) ctx.err(at(path, 'learn'), 'must be a string');
    if (ch.numbers !== undefined) {
      if (!Array.isArray(ch.numbers)) ctx.err(at(path, 'numbers'), 'must be an array');
      else ch.numbers.forEach((n, i) => {
        const p = at(at(path, 'numbers'), i);
        if (!isObj(n)) { ctx.err(p, 'must be an object with label and value'); return; }
        unknownKeys(n, ['label', 'value'], p, ctx);
        if (!isText(n.label)) ctx.err(at(p, 'label'), 'must be a non-empty string');
        if (!isStr(n.value) && !isNum(n.value)) ctx.err(at(p, 'value'), 'must be a string or number');
      });
    }

    // Roles first: selectors and diagrams below are checked against them.
    const roles = [];
    if (ch.roles !== undefined) {
      if (!Array.isArray(ch.roles)) ctx.err(at(path, 'roles'), 'must be an array of strings');
      else ch.roles.forEach((r, i) => {
        if (!isText(r)) ctx.err(at(at(path, 'roles'), i), 'must be a non-empty string');
        else if (roles.includes(r)) ctx.err(at(at(path, 'roles'), i), `duplicate role "${r}"`);
        else roles.push(r);
      });
    }
    const denv = { roles };

    if (ch.palette !== undefined && ch.palette !== 'chapter' && ch.palette !== 'all') {
      if (!Array.isArray(ch.palette)) ctx.err(at(path, 'palette'), 'must be "chapter", "all" or an array of block types');
      else ch.palette.forEach((t, i) => {
        if (!CATALOG.byType[t] && !CATALOG.groupByType[t]) ctx.err(at(at(path, 'palette'), i), `unknown block type "${t}"`);
      });
    }

    let startIds = new Set();
    if (ch.start !== undefined && ch.start !== null) startIds = checkCompact(ch.start, at(path, 'start'), ctx, denv);
    if (ch.locked !== undefined) {
      if (!Array.isArray(ch.locked)) ctx.err(at(path, 'locked'), 'must be an array of node ids from start');
      else ch.locked.forEach((id, i) => {
        if (!startIds.has(id)) ctx.err(at(at(path, 'locked'), i), `"${id}" is not a node in start`);
      });
    }
    if (ch.budget !== undefined && ch.budget !== null && (!isNum(ch.budget) || ch.budget <= 0)) {
      ctx.err(at(path, 'budget'), 'must be a positive number or null');
    }

    if (ch.estimate !== undefined) {
      if (!Array.isArray(ch.estimate)) ctx.err(at(path, 'estimate'), 'must be an array');
      else ch.estimate.forEach((q, i) => {
        const p = at(at(path, 'estimate'), i);
        if (!isObj(q)) { ctx.err(p, 'must be an object'); return; }
        unknownKeys(q, ['q', 'answer', 'unit', 'tolerance', 'workings'], p, ctx);
        if (!isText(q.q)) ctx.err(at(p, 'q'), 'must be a non-empty string');
        if (!isNum(q.answer)) ctx.err(at(p, 'answer'), 'must be a number');
        if (q.unit !== undefined && !isStr(q.unit)) ctx.err(at(p, 'unit'), 'must be a string');
        if (!isNum(q.tolerance) || q.tolerance <= 0) ctx.err(at(p, 'tolerance'), 'must be a positive number (0.5 = ±50%)');
        if (!isText(q.workings)) ctx.err(at(p, 'workings'), 'must show the arithmetic');
      });
    }
    if (ch.tradeoff !== undefined && ch.tradeoff !== null) {
      const p = at(path, 'tradeoff');
      const t = ch.tradeoff;
      if (!isObj(t)) ctx.err(p, 'must be an object or null');
      else {
        unknownKeys(t, ['q', 'choices', 'correct', 'why'], p, ctx);
        if (!isText(t.q)) ctx.err(at(p, 'q'), 'must be a non-empty string');
        if (!Array.isArray(t.choices) || t.choices.length < 2) ctx.err(at(p, 'choices'), 'must list at least two choices');
        else checkStringArray(t.choices, at(p, 'choices'), ctx);
        if (!isInt(t.correct) || !Array.isArray(t.choices) || t.correct < 0 || t.correct >= t.choices.length) {
          ctx.err(at(p, 'correct'), 'must be the index of one of the choices');
        }
        if (!isText(t.why)) ctx.err(at(p, 'why'), 'must be a non-empty string');
      }
    }

    const ep = at(path, 'expected');
    const ex = ch.expected;
    if (!isObj(ex)) { ctx.err(ep, 'must be an object with rules and solution'); return; }
    unknownKeys(ex, ['rules', 'solution', 'alt', 'naive'], ep, ctx);
    const ruleIds = new Set();
    if (!Array.isArray(ex.rules) || ex.rules.length === 0) {
      ctx.err(at(ep, 'rules'), 'must be a non-empty array');
    } else {
      const counts = { required: 0, bonus: 0, warn: 0 };
      ex.rules.forEach((r, i) => {
        checkRule(r, at(at(ep, 'rules'), i), ctx, denv, ruleIds);
        if (isObj(r)) counts[r.severity || 'required'] = (counts[r.severity || 'required'] || 0) + 1;
      });
      if (counts.required < 3 || counts.required > 8) ctx.warn(at(ep, 'rules'), `${counts.required} required rules (the guideline is 3–8)`);
      if (counts.bonus > 4) ctx.warn(at(ep, 'rules'), `${counts.bonus} bonus rules (the guideline is 0–4)`);
      if (counts.warn > 3) ctx.warn(at(ep, 'rules'), `${counts.warn} warn rules (the guideline is 0–3)`);
    }
    if (ex.solution === undefined) ctx.err(at(ep, 'solution'), 'is required (the reference design)');
    else checkCompact(ex.solution, at(ep, 'solution'), ctx, denv);
    if (ex.alt !== undefined) {
      if (!Array.isArray(ex.alt)) ctx.err(at(ep, 'alt'), 'must be an array of diagrams');
      else ex.alt.forEach((d, i) => checkCompact(d, at(at(ep, 'alt'), i), ctx, denv));
    }
    if (ex.naive !== undefined) {
      if (!Array.isArray(ex.naive)) ctx.err(at(ep, 'naive'), 'must be an array');
      else ex.naive.forEach((nv, i) => {
        const p = at(at(ep, 'naive'), i);
        if (!isObj(nv)) { ctx.err(p, 'must be an object with diagram and fails'); return; }
        unknownKeys(nv, ['diagram', 'fails'], p, ctx);
        checkCompact(nv.diagram, at(p, 'diagram'), ctx, denv);
        if (!Array.isArray(nv.fails) || nv.fails.length === 0) ctx.err(at(p, 'fails'), 'must list the rule ids this design fails');
        else nv.fails.forEach((id, j) => {
          if (!ruleIds.has(id)) ctx.err(at(at(p, 'fails'), j), `unknown rule id "${id}"`);
        });
      });
    }
  }

  function checkRule(r, path, ctx, denv, ruleIds) {
    if (!isObj(r)) { ctx.err(path, 'must be an object'); return; }
    unknownKeys(r, ['id', 'severity', 'text', 'hint', 'weight', 'check'], path, ctx);
    if (!isText(r.id)) ctx.err(at(path, 'id'), 'must be a non-empty string');
    else if (ruleIds.has(r.id)) ctx.err(at(path, 'id'), `duplicate rule id "${r.id}"`);
    else ruleIds.add(r.id);
    if (r.severity !== undefined && !['required', 'bonus', 'warn'].includes(r.severity)) {
      ctx.err(at(path, 'severity'), 'must be "required", "bonus" or "warn"');
    }
    if (!isText(r.text)) ctx.err(at(path, 'text'), 'must be a non-empty string');
    if (r.hint !== undefined && !isStr(r.hint)) ctx.err(at(path, 'hint'), 'must be a string');
    if (r.weight !== undefined && (!isNum(r.weight) || r.weight <= 0)) ctx.err(at(path, 'weight'), 'must be a positive number');
    if (!isObj(r.check)) ctx.err(at(path, 'check'), 'must be an object');
    else checkCheck(r.check, at(path, 'check'), ctx, denv);
  }

  // Which fields each check type accepts besides its own key.
  const CHECK_FIELDS = {
    count: ['min', 'max'], capacity: ['min'], edge: ['min'], noEdge: [], path: ['kind'], noPath: [],
    prop: ['key', 'eq', 'in', 'gte', 'lte', 'all'], edgeProp: ['key', 'eq', 'in', 'gte', 'lte', 'all'],
    inGroups: ['group', 'distinct'], notInGroup: ['group'], fanOut: ['min', 'kind'], budget: [],
    any: [], not: [], all: [],
  };

  // `all` is both a combinator (array) and a modifier of prop checks (boolean).
  function checkTypeOf(check) {
    const found = CHECK_TYPES.filter((k) => k in check && !(k === 'all' && typeof check.all === 'boolean'));
    return found.length === 1 ? found[0] : found.length === 0 ? null : found;
  }

  function checkCheck(check, path, ctx, denv) {
    if (!isObj(check)) { ctx.err(path, 'must be a check object'); return; }
    const type = checkTypeOf(check);
    if (type === null) {
      const k = Object.keys(check)[0];
      ctx.err(path, k ? `unknown check type "${k}"` : 'empty check');
      return;
    }
    if (Array.isArray(type)) { ctx.err(path, `a check can only have one type, found ${type.join(', ')}`); return; }
    for (const k of Object.keys(check)) {
      if (k !== type && !CHECK_FIELDS[type].includes(k)) ctx.err(at(path, k), `"${k}" is not a field of a ${type} check`);
    }
    const optInt = (k, min) => {
      if (check[k] !== undefined && (!isInt(check[k]) || check[k] < min)) ctx.err(at(path, k), `must be a whole number ≥ ${min}`);
    };
    const kindOk = (v, p) => { if (v !== undefined && !EDGE_KIND_SET.has(v)) ctx.err(p, `unknown edge kind "${v}"`); };
    const v = check[type];
    switch (type) {
      case 'count': checkSel(v, at(path, type), ctx, denv); optInt('min', 0); optInt('max', 0); break;
      case 'capacity':
        checkSel(v, at(path, type), ctx, denv);
        if (!isInt(check.min) || check.min < 1) ctx.err(at(path, 'min'), 'must be a whole number ≥ 1');
        break;
      case 'edge': case 'noEdge':
        checkEdgeSel(v, at(path, type), ctx, denv);
        if (type === 'edge') optInt('min', 1);
        break;
      case 'path':
        if (!Array.isArray(v) || v.length < 2) ctx.err(at(path, type), 'must list at least two selectors');
        else v.forEach((s, i) => checkSel(s, at(at(path, type), i), ctx, denv));
        kindOk(check.kind, at(path, 'kind'));
        break;
      case 'noPath':
        if (!isObj(v)) { ctx.err(at(path, type), 'must be { from, to, avoiding? }'); break; }
        for (const k of Object.keys(v)) if (!['from', 'to', 'avoiding'].includes(k)) ctx.err(at(at(path, type), k), `unknown field "${k}"`);
        checkSel(v.from, at(at(path, type), 'from'), ctx, denv);
        checkSel(v.to, at(at(path, type), 'to'), ctx, denv);
        if (v.avoiding !== undefined) checkSel(v.avoiding, at(at(path, type), 'avoiding'), ctx, denv);
        break;
      case 'prop': case 'edgeProp': {
        let specs;
        if (type === 'prop') {
          checkSel(v, at(path, type), ctx, denv);
          specs = isObj(v) ? propSpecs(candidateTypes(v), check.key) : [];
          if (isText(check.key) && isObj(v) && specs.length === 0) ctx.err(at(path, 'key'), `unknown prop "${check.key}" for ${describeSel(v)}`);
        } else {
          checkEdgeSel(v, at(path, type), ctx, denv);
          specs = EDGE_PROPS[check.key] ? [EDGE_PROPS[check.key]] : [];
          if (isText(check.key) && specs.length === 0) ctx.err(at(path, 'key'), `unknown connection prop "${check.key}"`);
        }
        if (!isText(check.key)) ctx.err(at(path, 'key'), 'must name a prop');
        if (!['eq', 'in', 'gte', 'lte'].some((k) => k in check)) ctx.err(path, 'needs at least one of eq, in, gte, lte');
        if (check.all !== undefined && typeof check.all !== 'boolean') ctx.err(at(path, 'all'), 'must be true or false');
        if (specs.length) {
          if ('eq' in check) checkValue(specs, check.eq, at(path, 'eq'), ctx, denv);
          if ('in' in check) {
            if (!Array.isArray(check.in) || !check.in.length) ctx.err(at(path, 'in'), 'must be a non-empty array');
            else check.in.forEach((x, i) => checkValue(specs, x, at(at(path, 'in'), i), ctx, denv));
          }
        }
        for (const k of ['gte', 'lte']) if (k in check && !isNum(check[k])) ctx.err(at(path, k), 'must be a number');
        break;
      }
      case 'inGroups': case 'notInGroup':
        checkSel(v, at(path, type), ctx, denv);
        checkSel(check.group, at(path, 'group'), ctx, denv, true);
        if (type === 'inGroups' && (!isInt(check.distinct) || check.distinct < 1)) ctx.err(at(path, 'distinct'), 'must be a whole number ≥ 1');
        break;
      case 'fanOut':
        checkSel(v, at(path, type), ctx, denv);
        if (!isInt(check.min) || check.min < 1) ctx.err(at(path, 'min'), 'must be a whole number ≥ 1');
        kindOk(check.kind, at(path, 'kind'));
        break;
      case 'budget':
        if (!isNum(v) || v <= 0) ctx.err(at(path, type), 'must be a positive number');
        break;
      case 'any': case 'all':
        if (!Array.isArray(v) || !v.length) ctx.err(at(path, type), 'must be a non-empty array of checks');
        else v.forEach((c, i) => checkCheck(c, at(at(path, type), i), ctx, denv));
        break;
      case 'not':
        checkCheck(v, at(path, type), ctx, denv);
        break;
      default: break;
    }
  }

  function checkEdgeSel(v, path, ctx, denv) {
    if (!isObj(v)) { ctx.err(path, 'must be { from, to, kind? }'); return; }
    for (const k of Object.keys(v)) if (!['from', 'to', 'kind'].includes(k)) ctx.err(at(path, k), `unknown field "${k}"`);
    checkSel(v.from, at(path, 'from'), ctx, denv);
    checkSel(v.to, at(path, 'to'), ctx, denv);
    if (v.kind !== undefined && !EDGE_KIND_SET.has(v.kind)) ctx.err(at(path, 'kind'), `unknown edge kind "${v.kind}"`);
  }

  function candidateTypes(sel) {
    if (sel.type !== undefined) return [].concat(sel.type).filter((t) => CATALOG.byType[t]);
    if (sel.category !== undefined) return BLOCKS.filter((b) => b.category === sel.category).map((b) => b.type);
    return BLOCKS.map((b) => b.type);
  }

  function propSpecs(types, key) {
    return types.map((t) => CATALOG.byType[t].props[key]).filter(Boolean);
  }

  // Selectors pick nodes (or groups, when isGroup) by type, category and props.
  function checkSel(sel, path, ctx, denv, isGroup) {
    if (!isObj(sel)) { ctx.err(path, 'must be a selector object like { "type": "cache" }'); return; }
    const allowed = isGroup ? ['type'] : ['type', 'category', 'props'];
    for (const k of Object.keys(sel)) if (!allowed.includes(k)) ctx.err(at(path, k), `"${k}" is not a selector field`);
    if (sel.type === undefined && (isGroup || sel.category === undefined)) {
      ctx.err(path, isGroup ? 'a group selector needs a type' : 'a selector needs a type or a category');
      return;
    }
    if (sel.type !== undefined) {
      const types = [].concat(sel.type);
      if (!types.length) ctx.err(path, 'type list is empty');
      for (const t of types) {
        if (!isStr(t)) ctx.err(path, 'type must be a string or an array of strings');
        else if (isGroup ? !CATALOG.groupByType[t] : !CATALOG.byType[t]) {
          ctx.err(path, isGroup ? `unknown group type "${t}"` : `unknown block type "${t}"`);
        }
      }
    }
    if (sel.category !== undefined && !CATEGORY_SET.has(sel.category)) ctx.err(at(path, 'category'), `unknown category "${sel.category}"`);
    if (sel.props !== undefined) {
      if (!isObj(sel.props)) { ctx.err(at(path, 'props'), 'must be an object'); return; }
      const types = candidateTypes(sel);
      for (const [key, val] of Object.entries(sel.props)) {
        const specs = propSpecs(types, key);
        const p = at(at(path, 'props'), key);
        if (!specs.length) { ctx.err(p, `unknown prop "${key}" for ${describeSel(sel)}`); continue; }
        if (Array.isArray(val)) {
          if (!val.length) ctx.err(p, 'value list is empty');
          val.forEach((x, i) => checkValue(specs, x, at(p, i), ctx, denv));
        } else checkValue(specs, val, p, ctx, denv);
      }
    }
  }

  function valueProblem(spec, v, denv) {
    switch (spec.kind) {
      case 'bool': return typeof v === 'boolean' ? null : 'must be true or false';
      case 'int':
        if (!isInt(v)) return 'must be a whole number';
        if (spec.min !== undefined && v < spec.min) return `must be ≥ ${spec.min}`;
        if (spec.max !== undefined && v > spec.max) return `must be ≤ ${spec.max}`;
        return null;
      case 'enum': {
        const options = spec.options === 'roles' ? (denv ? denv.roles : []) : spec.options;
        if (options.includes(v)) return null;
        return spec.options === 'roles'
          ? `unknown role "${v}" — add it to the challenge's roles`
          : `"${v}" is not one of ${options.join(', ')}`;
      }
      case 'text': return isStr(v) ? null : 'must be a string';
      default: return 'unknown prop kind';
    }
  }

  // With several candidate types, a value is fine if it suits any of their specs.
  function checkValue(specs, v, path, ctx, denv) {
    const problems = specs.map((s) => valueProblem(s, v, denv));
    if (problems.every(Boolean)) ctx.err(path, problems[0]);
  }

  // Compact diagrams: { n: [[id, type, props?, label?]], e: [[from, to, kind?, props?]], g: [[id, type, members, label?]] }
  function checkCompact(d, path, ctx, denv) {
    const ids = new Set();
    if (!isObj(d)) { ctx.err(path, 'must be a compact diagram { n, e, g }'); return ids; }
    unknownKeys(d, ['n', 'e', 'g'], path, ctx);
    const all = new Set();
    if (!Array.isArray(d.n)) ctx.err(at(path, 'n'), 'must be an array of nodes');
    else d.n.forEach((row, i) => {
      const p = at(at(path, 'n'), i);
      if (!Array.isArray(row) || row.length < 2 || row.length > 4) { ctx.err(p, 'must be [id, type, props?, label?]'); return; }
      const [id, type, props, label] = row;
      if (!isText(id)) ctx.err(at(p, 0), 'node id must be a non-empty string');
      else if (all.has(id)) ctx.err(at(p, 0), `duplicate id "${id}"`);
      else { all.add(id); ids.add(id); }
      const def = CATALOG.byType[type];
      if (!def) { ctx.err(at(p, 1), CATALOG.groupByType[type] ? `"${type}" is a group type — put it in g` : `unknown block type "${type}"`); return; }
      if (props !== undefined && props !== null) {
        if (!isObj(props)) ctx.err(at(p, 2), 'props must be an object');
        else for (const [k, v] of Object.entries(props)) {
          if (!def.props[k]) ctx.err(at(at(p, 2), k), `unknown prop "${k}" for ${def.label}`);
          else checkValue([def.props[k]], v, at(at(p, 2), k), ctx, denv);
        }
      }
      if (label !== undefined && !isStr(label)) ctx.err(at(p, 3), 'label must be a string');
    });
    if (d.e !== undefined) {
      if (!Array.isArray(d.e)) ctx.err(at(path, 'e'), 'must be an array of edges');
      else {
        const pairs = new Set();
        d.e.forEach((row, i) => {
          const p = at(at(path, 'e'), i);
          if (!Array.isArray(row) || row.length < 2 || row.length > 4) { ctx.err(p, 'must be [from, to, kind?, props?]'); return; }
          const [from, to, kind, props] = row;
          if (!ids.has(from)) ctx.err(at(p, 0), `dangling edge: no node "${from}"`);
          if (!ids.has(to)) ctx.err(at(p, 1), `dangling edge: no node "${to}"`);
          if (from === to) ctx.err(p, 'a block cannot connect to itself');
          if (pairs.has(from + '→' + to)) ctx.err(p, `duplicate edge ${from} → ${to}`);
          pairs.add(from + '→' + to);
          if (kind !== undefined && kind !== null && !EDGE_KIND_SET.has(kind)) ctx.err(at(p, 2), `unknown edge kind "${kind}"`);
          if (props !== undefined && props !== null) {
            if (!isObj(props)) ctx.err(at(p, 3), 'props must be an object');
            else for (const [k, v] of Object.entries(props)) {
              if (!EDGE_PROPS[k]) ctx.err(at(at(p, 3), k), `unknown connection prop "${k}"`);
              else checkValue([EDGE_PROPS[k]], v, at(at(p, 3), k), ctx, denv);
            }
          }
        });
      }
    }
    if (d.g !== undefined) {
      if (!Array.isArray(d.g)) ctx.err(at(path, 'g'), 'must be an array of groups');
      else d.g.forEach((row, i) => {
        const p = at(at(path, 'g'), i);
        if (!Array.isArray(row) || row.length < 3 || row.length > 4) { ctx.err(p, 'must be [id, type, memberIds, label?]'); return; }
        const [id, type, members, label] = row;
        if (!isText(id)) ctx.err(at(p, 0), 'group id must be a non-empty string');
        else if (all.has(id)) ctx.err(at(p, 0), `duplicate id "${id}"`);
        else all.add(id);
        if (!CATALOG.groupByType[type]) ctx.err(at(p, 1), `unknown group type "${type}"`);
        if (!Array.isArray(members)) ctx.err(at(p, 2), 'members must be an array of node ids');
        else members.forEach((m, j) => { if (!ids.has(m)) ctx.err(at(at(p, 2), j), `no node "${m}"`); });
        if (label !== undefined && !isStr(label)) ctx.err(at(p, 3), 'label must be a string');
      });
    }
    return ids;
  }

  function expandDiagram(compact, catalog, opts) {
    void catalog; // the engine catalog is the only vocabulary; accepted for API symmetry
    const roles = (opts && opts.roles) || [];
    const c = compact || {};
    const nodes = (c.n || []).map(([id, type, props, label]) => ({
      id, type, x: 0, y: 0,
      label: label || CATALOG.byType[type].label,
      props: Object.assign(defaultProps(type, roles), props || {}),
    }));
    const typeOf = new Map(nodes.map((n) => [n.id, n.type]));
    const edges = (c.e || []).map(([from, to, kind, props], i) => ({
      id: 'e' + (i + 1), from, to,
      kind: kind || inferEdgeKind(typeOf.get(from), typeOf.get(to)),
      props: Object.assign(defaultEdgeProps(), props || {}),
    }));
    const groups = (c.g || []).map(([id, type, members, label]) => ({
      id, type, x: 0, y: 0, w: 0, h: 0, label: label || CATALOG.groupByType[type].label, members: members || [],
    }));
    const placed = layout({ nodes, edges, groups });
    placed.groups.forEach((g) => { delete g.members; });
    placed.seq = nodes.length + edges.length + groups.length + 1;
    return placed;
  }

  /* ==== [CORE:GRAPH] ==== */
  function selMatches(node, sel) {
    if (!sel) return false;
    if (sel.type !== undefined && ![].concat(sel.type).includes(node.type)) return false;
    if (sel.category !== undefined) {
      const def = CATALOG.byType[node.type];
      if (!def || def.category !== sel.category) return false;
    }
    if (sel.props) {
      for (const [key, want] of Object.entries(sel.props)) {
        const have = propValue(node, key);
        if (Array.isArray(want) ? !want.includes(have) : have !== want) return false;
      }
    }
    return true;
  }

  function groupMatches(group, sel) {
    return !!sel && [].concat(sel.type).includes(group.type);
  }

  function makeGraph(diagram) {
    const nodes = diagram.nodes || [];
    const byId = new Map(nodes.map((n) => [n.id, n]));
    const edges = (diagram.edges || []).filter((e) => byId.has(e.from) && byId.has(e.to));
    return { diagram, nodes, byId, edges, groups: diagram.groups || [] };
  }

  const pick = (g, sel) => g.nodes.filter((n) => selMatches(n, sel));

  function edgesMatching(g, es) {
    return g.edges.filter((e) => selMatches(g.byId.get(e.from), es.from) && selMatches(g.byId.get(e.to), es.to) &&
      (es.kind === undefined || e.kind === es.kind));
  }

  // Nodes reachable in ≥ 1 step. Visited set guards against cycles.
  function reachable(g, startIds, edgeOk, blocked) {
    const adj = new Map();
    for (const e of g.edges) {
      if (!edgeOk(e)) continue;
      if (!adj.has(e.from)) adj.set(e.from, []);
      adj.get(e.from).push(e.to);
    }
    const seen = new Set();
    const stack = [...startIds];
    while (stack.length) {
      const u = stack.pop();
      for (const v of adj.get(u) || []) {
        if (seen.has(v) || (blocked && blocked.has(v))) continue;
        seen.add(v);
        stack.push(v);
      }
    }
    return seen;
  }

  const centerOf = (n) => ({ x: n.x + NODE_W / 2, y: n.y + NODE_H / 2 });
  const inRect = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

  // Group membership is geometric: a node belongs to every group containing its center.
  function groupsContaining(diagram, node) {
    const c = centerOf(node);
    return (diagram.groups || []).filter((gr) => inRect(c, gr));
  }

  function describeSel(sel) {
    if (!isObj(sel)) return 'block';
    let s;
    if (sel.type !== undefined) {
      s = [].concat(sel.type).map((t) => (CATALOG.byType[t] || CATALOG.groupByType[t] || { label: t }).label).join(' or ');
    } else if (sel.category !== undefined) {
      const c = CATEGORIES.find((x) => x.id === sel.category);
      s = `any ${c ? c.label.toLowerCase() : sel.category} block`;
    } else s = 'any block';
    if (isObj(sel.props) && Object.keys(sel.props).length) {
      s += ' (' + Object.entries(sel.props).map(([k, v]) => `${k}: ${[].concat(v).join('/')}`).join(', ') + ')';
    }
    return s;
  }

  /* ==== [CORE:VALIDATOR] ==== */
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many || one + 's'}`;

  function valueOk(check, v) {
    if ('eq' in check && v !== check.eq) return false;
    if ('in' in check && !check.in.includes(v)) return false;
    if ('gte' in check && !(typeof v === 'number' && v >= check.gte)) return false;
    if ('lte' in check && !(typeof v === 'number' && v <= check.lte)) return false;
    return true;
  }

  function wantText(check) {
    const parts = [];
    if ('eq' in check) parts.push(`= ${check.eq}`);
    if ('in' in check) parts.push(`one of ${check.in.join(', ')}`);
    if ('gte' in check) parts.push(`≥ ${check.gte}`);
    if ('lte' in check) parts.push(`≤ ${check.lte}`);
    return parts.join(' and ');
  }

  function evalCheck(check, g) {
    const type = checkTypeOf(check);
    const v = check[type];
    const skipReplication = (kind) => (e) => (kind ? e.kind === kind : e.kind !== 'replication');
    switch (type) {
      case 'count': {
        const n = pick(g, v).length;
        const min = check.min !== undefined ? check.min : check.max !== undefined ? 0 : 1;
        const max = check.max !== undefined ? check.max : Infinity;
        const need = max === Infinity ? `need ${min} or more` : min === 0 ? `allowed at most ${max}` : `need ${min}–${max}`;
        return { pass: n >= min && n <= max, detail: `${plural(n, describeSel(v))} found; ${need}.` };
      }
      case 'capacity': {
        const sum = pick(g, v).reduce((s, n) => s + (Number(propValue(n, 'replicas')) || 1), 0);
        return { pass: sum >= check.min, detail: `${describeSel(v)} capacity is ${sum} (replicas counted); need ${check.min}.` };
      }
      case 'edge': {
        const n = edgesMatching(g, v).length;
        const min = check.min || 1;
        const kind = v.kind ? ` ${v.kind}` : '';
        return { pass: n >= min, detail: `${plural(n, kind.trim() ? kind.trim() + ' connection' : 'connection')} from ${describeSel(v.from)} to ${describeSel(v.to)}; need ${min}.` };
      }
      case 'noEdge': {
        const n = edgesMatching(g, v).length;
        return { pass: n === 0, detail: n ? `${plural(n, 'connection')} from ${describeSel(v.from)} straight to ${describeSel(v.to)}.` : 'No direct connection.' };
      }
      case 'path': {
        let current = new Set(pick(g, v[0]).map((n) => n.id));
        let reached = current.size ? 1 : 0;
        for (let i = 1; i < v.length && current.size; i++) {
          const r = reachable(g, current, skipReplication(check.kind));
          current = new Set([...r].filter((id) => selMatches(g.byId.get(id), v[i])));
          if (current.size) reached = i + 1;
        }
        const chain = v.map(describeSel).join(' → ');
        return {
          pass: current.size > 0 && reached === v.length,
          detail: reached === v.length ? `Path found: ${chain}.` : `No path ${chain}; it stops after ${reached ? describeSel(v[reached - 1]) : 'the start'}.`,
        };
      }
      case 'noPath': {
        const from = pick(g, v.from).map((n) => n.id);
        const blocked = v.avoiding ? new Set(pick(g, v.avoiding).map((n) => n.id)) : null;
        const r = reachable(g, from, skipReplication(), blocked);
        const hit = [...r].some((id) => selMatches(g.byId.get(id), v.to));
        const via = v.avoiding ? ` without passing ${describeSel(v.avoiding)}` : '';
        return { pass: !hit, detail: hit ? `${describeSel(v.from)} can reach ${describeSel(v.to)}${via}.` : `${describeSel(v.from)} cannot reach ${describeSel(v.to)}${via}.` };
      }
      case 'prop': {
        const nodes = pick(g, v);
        const ok = nodes.filter((n) => valueOk(check, propValue(n, check.key)));
        const pass = check.all ? nodes.length > 0 && ok.length === nodes.length : ok.length > 0;
        return { pass, detail: `${ok.length} of ${plural(nodes.length, describeSel(v))} have ${check.key} ${wantText(check)}${check.all ? ' (all must)' : ''}.` };
      }
      case 'edgeProp': {
        const edges = edgesMatching(g, v);
        const ok = edges.filter((e) => valueOk(check, edgePropValue(e, check.key)));
        const pass = check.all ? edges.length > 0 && ok.length === edges.length : ok.length > 0;
        return { pass, detail: `${ok.length} of ${plural(edges.length, 'connection')} from ${describeSel(v.from)} to ${describeSel(v.to)} have ${check.key} ${wantText(check)}.` };
      }
      case 'inGroups': {
        const groups = g.groups.filter((gr) => groupMatches(gr, check.group));
        const hit = new Set();
        for (const n of pick(g, v)) {
          const c = centerOf(n);
          for (const gr of groups) if (inRect(c, gr)) hit.add(gr.id);
        }
        return { pass: hit.size >= check.distinct, detail: `${describeSel(v)} appears in ${plural(hit.size, describeSel(check.group).toLowerCase())}; need ${check.distinct}.` };
      }
      case 'notInGroup': {
        const groups = g.groups.filter((gr) => groupMatches(gr, check.group));
        const bad = pick(g, v).filter((n) => groups.some((gr) => inRect(centerOf(n), gr)));
        return { pass: bad.length === 0, detail: bad.length ? `${plural(bad.length, describeSel(v))} inside a ${describeSel(check.group).toLowerCase()}.` : `No ${describeSel(v)} inside a ${describeSel(check.group).toLowerCase()}.` };
      }
      case 'fanOut': {
        let best = 0;
        for (const n of pick(g, v)) {
          const targets = new Set(g.edges.filter((e) => e.from === n.id && (!check.kind || e.kind === check.kind)).map((e) => e.to));
          best = Math.max(best, targets.size);
        }
        return { pass: best >= check.min, detail: `The busiest ${describeSel(v)} connects to ${plural(best, 'block')}; need ${check.min}.` };
      }
      case 'budget': {
        const cost = diagramCost(g.diagram);
        return { pass: cost <= v, detail: `Total cost ${cost}; budget ${v}.` };
      }
      case 'all': {
        const rs = v.map((c) => evalCheck(c, g));
        const failed = rs.filter((r) => !r.pass);
        return { pass: failed.length === 0, detail: (failed.length ? failed : rs).map((r) => r.detail).join(' ') };
      }
      case 'any': {
        const rs = v.map((c) => evalCheck(c, g));
        const passed = rs.find((r) => r.pass);
        return { pass: !!passed, detail: passed ? passed.detail : 'None of the options hold: ' + rs.map((r) => r.detail).join(' ') };
      }
      case 'not': {
        const r = evalCheck(v, g);
        return { pass: !r.pass, detail: r.detail };
      }
      default:
        return { pass: false, detail: 'Unknown check.' };
    }
  }

  function validate(diagram, challenge) {
    const g = makeGraph(diagram);
    return ((challenge.expected && challenge.expected.rules) || []).map((rule) => {
      const r = evalCheck(rule.check, g);
      return {
        id: rule.id,
        pass: r.pass,
        severity: rule.severity || 'required',
        text: rule.text,
        hint: rule.hint || '',
        weight: rule.weight || 1,
        detail: r.detail,
      };
    });
  }

  // Stars: with bonus rules, the classic formula; without bonus rules, each correct
  // estimate/trade-off answer adds a star. Either way the 3rd star needs the budget respected.
  function score(results, opts) {
    const o = opts || {};
    const req = results.filter((r) => r.severity === 'required');
    const bonus = results.filter((r) => r.severity === 'bonus');
    const warns = results.filter((r) => r.severity === 'warn' && !r.pass);
    const solved = req.every((r) => r.pass);
    const bonusTotal = bonus.reduce((s, r) => s + r.weight, 0);
    const bonusPassed = bonus.filter((r) => r.pass).reduce((s, r) => s + r.weight, 0);
    const budgetOk = o.budgetOk !== false;
    let stars = 0;
    if (solved) {
      if (bonusTotal > 0) {
        stars = 1 + (bonusPassed >= bonusTotal / 2 ? 1 : 0) + (bonusPassed === bonusTotal && budgetOk ? 1 : 0);
      } else {
        stars = Math.min(3, 1 + (o.quizCorrect || 0));
        if (stars === 3 && !budgetOk) stars = 2;
      }
    }
    return {
      solved, stars, budgetOk,
      required: { passed: req.filter((r) => r.pass).length, total: req.length },
      bonus: { passed: bonusPassed, total: bonusTotal },
      warnings: warns.length,
    };
  }

  function budgetOk(diagram, challenge) {
    return challenge.budget === null || challenge.budget === undefined || diagramCost(diagram) <= challenge.budget;
  }

  function estimateOk(item, value) {
    const v = Number(value);
    if (!Number.isFinite(v)) return false;
    return Math.abs(v - item.answer) <= Math.abs(item.answer) * item.tolerance + 1e-9;
  }

  function collectTypes(obj, out) {
    if (Array.isArray(obj)) obj.forEach((x) => collectTypes(x, out));
    else if (isObj(obj)) {
      for (const [k, v] of Object.entries(obj)) {
        if (k === 'type') [].concat(v).forEach((t) => out.add(t));
        else collectTypes(v, out);
      }
    }
    return out;
  }

  // For the 3rd-fail hint: one block type from the reference design the player hasn't used,
  // preferring types that a failing required rule mentions.
  function suggestMissingBlock(diagram, challenge) {
    const sol = challenge.expected && challenge.expected.solution;
    if (!sol || !Array.isArray(sol.n)) return null;
    const have = new Set((diagram.nodes || []).map((n) => n.type));
    const results = validate(diagram, challenge);
    const wanted = new Set();
    challenge.expected.rules.forEach((rule, i) => {
      if (!results[i].pass && results[i].severity === 'required') collectTypes(rule.check, wanted);
    });
    const missing = [...new Set(sol.n.map((row) => row[1]))].filter((t) => !have.has(t));
    return missing.find((t) => wanted.has(t)) || missing[0] || null;
  }

  function resolvePalette(pack, challenge) {
    const blocks = new Set();
    const groups = new Set();
    const addType = (t) => { if (CATALOG.byType[t]) blocks.add(t); else if (CATALOG.groupByType[t]) groups.add(t); };
    const addCompact = (d) => {
      if (!isObj(d)) return;
      (d.n || []).forEach((row) => addType(row[1]));
      (d.g || []).forEach((row) => addType(row[1]));
    };
    const p = challenge.palette;
    if (p === 'all') {
      BLOCKS.forEach((b) => blocks.add(b.type));
      GROUP_TYPES.forEach((g) => groups.add(g.type));
    } else if (Array.isArray(p)) {
      p.forEach(addType);
    } else {
      const order = pack.chapters.map((c) => c.id);
      const limit = order.indexOf(challenge.chapter);
      for (const ch of pack.challenges) {
        if (order.indexOf(ch.chapter) <= limit) addCompact(ch.expected && ch.expected.solution);
      }
    }
    addCompact(challenge.start);
    return {
      blocks: BLOCKS.map((b) => b.type).filter((t) => blocks.has(t)),
      groups: GROUP_TYPES.map((g) => g.type).filter((t) => groups.has(t)),
    };
  }

  /* ==== [CORE:LAYOUT] ==== */
  // Columns by longest-path depth (left → right), one barycenter pass per column, and each
  // group stacked in its own horizontal band so its rectangle contains only its members.
  const COL_W = 224;
  const ROW_H = 96;
  const PAD_X = 32;
  const PAD_TOP = 48;
  const PAD_BOTTOM = 32;
  const BAND_GAP = 32;
  const MARGIN = 48;

  function layout(diagram) {
    const nodes = diagram.nodes.map((n) => Object.assign({}, n));
    const groups = (diagram.groups || []).map((g) => Object.assign({}, g, { members: (g.members || []).slice() }));
    const out = Object.assign({}, diagram, { nodes, groups, edges: diagram.edges || [] });
    const idx = new Map(nodes.map((n, i) => [n.id, i]));
    const succ = nodes.map(() => []);
    const hasIn = nodes.map(() => false);
    for (const e of out.edges) {
      const a = idx.get(e.from);
      const b = idx.get(e.to);
      if (a === undefined || b === undefined || a === b) continue;
      succ[a].push(b);
      hasIn[b] = true;
    }

    // Drop back edges (DFS from sources first), then longest path on the DAG.
    const state = nodes.map(() => 0);
    const dag = nodes.map(() => []);
    const post = [];
    const visit = (u) => {
      state[u] = 1;
      for (const v of succ[u]) {
        if (state[v] === 1) continue;
        dag[u].push(v);
        if (state[v] === 0) visit(v);
      }
      state[u] = 2;
      post.push(u);
    };
    nodes.forEach((_, i) => { if (!hasIn[i] && state[i] === 0) visit(i); });
    nodes.forEach((_, i) => { if (state[i] === 0) visit(i); });
    const depth = nodes.map(() => 0);
    const preds = nodes.map(() => []);
    for (let k = post.length - 1; k >= 0; k--) {
      const u = post[k];
      for (const v of dag[u]) {
        depth[v] = Math.max(depth[v], depth[u] + 1);
        preds[v].push(u);
      }
    }

    // Group tree from member sets: the parent is the smallest earlier-or-larger superset.
    const sets = groups.map((g) => new Set(g.members.filter((id) => idx.has(id))));
    const parent = groups.map((g, i) => {
      let best = -1;
      groups.forEach((h, j) => {
        if (i === j) return;
        const bigger = sets[j].size > sets[i].size || (sets[j].size === sets[i].size && j < i);
        if (!bigger || ![...sets[i]].every((id) => sets[j].has(id))) return;
        if (best === -1 || sets[j].size < sets[best].size || (sets[j].size === sets[best].size && j > best)) best = j;
      });
      return best;
    });
    const level = groups.map((_, i) => { let d = 0; for (let p = parent[i]; p !== -1; p = parent[p]) d++; return d; });
    const home = nodes.map((n) => {
      let best = -1;
      groups.forEach((_, j) => {
        if (sets[j].has(n.id) && (best === -1 || level[j] > level[best])) best = j;
      });
      return best;
    });

    const pos = new Map();
    const placeRows = (list, top) => {
      const cols = new Map();
      list.forEach((i) => { if (!cols.has(depth[i])) cols.set(depth[i], []); cols.get(depth[i]).push(i); });
      let rows = 0;
      [...cols.keys()].sort((a, b) => a - b).forEach((c) => {
        const col = cols.get(c);
        const bary = (i) => {
          const ys = preds[i].filter((p) => pos.has(p)).map((p) => pos.get(p).y);
          return ys.length ? ys.reduce((s, y) => s + y, 0) / ys.length : Infinity;
        };
        const keyed = col.map((i, order) => ({ i, order, b: bary(i) }));
        keyed.sort((a, b) => (a.b === b.b ? a.order - b.order : a.b - b.b));
        keyed.forEach((k, r) => pos.set(k.i, { x: c * COL_W, y: top + r * ROW_H }));
        rows = Math.max(rows, col.length);
      });
      return rows ? top + (rows - 1) * ROW_H + NODE_H : top;
    };
    const band = new Map();
    const placeContainer = (cid, top) => {
      let y = top;
      const loose = nodes.map((_, i) => i).filter((i) => home[i] === cid);
      if (loose.length) y = placeRows(loose, y);
      groups.forEach((_, j) => {
        if (parent[j] !== cid) return;
        if (y > top) y += BAND_GAP;
        const gTop = y;
        const inner = placeContainer(j, gTop + PAD_TOP);
        y = Math.max(inner, gTop + PAD_TOP) + PAD_BOTTOM;
        band.set(j, { top: gTop, bottom: y });
      });
      return y;
    };
    placeContainer(-1, 0);

    // Horizontal extents bottom-up: innermost groups first, outer ones wrap them with padding.
    const rects = new Map();
    const order = groups.map((_, j) => j).sort((a, b) => level[b] - level[a]);
    for (const j of order) {
      let x0 = Infinity;
      let x1 = -Infinity;
      nodes.forEach((_, i) => {
        if (home[i] === j) { x0 = Math.min(x0, pos.get(i).x); x1 = Math.max(x1, pos.get(i).x + NODE_W); }
      });
      groups.forEach((_, k) => {
        if (parent[k] === j && rects.has(k)) { x0 = Math.min(x0, rects.get(k).x); x1 = Math.max(x1, rects.get(k).x + rects.get(k).w); }
      });
      if (x0 === Infinity) { x0 = 0; x1 = NODE_W + 2 * PAD_X; }
      const b = band.get(j);
      rects.set(j, { x: x0 - PAD_X, y: b.top, w: x1 - x0 + 2 * PAD_X, h: b.bottom - b.top });
    }

    let minX = Infinity;
    let minY = Infinity;
    pos.forEach((p) => { minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); });
    rects.forEach((r) => { minX = Math.min(minX, r.x); minY = Math.min(minY, r.y); });
    if (minX === Infinity) { minX = 0; minY = 0; }
    const dx = MARGIN - minX;
    const dy = MARGIN - minY;
    nodes.forEach((n, i) => { const p = pos.get(i); n.x = p.x + dx; n.y = p.y + dy; });
    groups.forEach((g, j) => { const r = rects.get(j); Object.assign(g, { x: r.x + dx, y: r.y + dy, w: r.w, h: r.h }); });
    return out;
  }

  /* ==== [CORE:SELFTEST] ==== */
  function runPackSelfTest(pack) {
    const report = { ok: true, challenges: [] };
    const empty = { v: 1, nodes: [], edges: [], groups: [] };
    for (const ch of pack.challenges) {
      const checks = [];
      const add = (name, pass, detail) => checks.push({ name, pass, detail: detail || '' });
      const quizMax = (ch.estimate || []).length + (ch.tradeoff ? 1 : 0);
      const run = (d) => {
        const res = validate(d, ch);
        return { res, sc: score(res, { budgetOk: budgetOk(d, ch), quizCorrect: quizMax }) };
      };
